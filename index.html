            </div>
          </div>

        </div>

        <!-- Section 2: Recent Retro Logs Stream -->
        <div class="glass-card rounded-3xl p-5 border border-pink-200 bg-white shadow-sm">
          <div class="flex items-center justify-between mb-3.5 pb-2.5 border-b border-pink-100">
            <div class="flex items-center space-x-2">
              <i data-lucide="history" class="w-4 h-4 text-pink-600"></i>
              <h3 class="text-sm font-black text-slate-900">🕒 本班近期事後補記歷史記錄</h3>
            </div>
            <span class="text-xs font-bold text-slate-400">共 ${retroEvents.length} 筆記錄</span>
          </div>

          ${retroEvents.length === 0 ? `
            <div class="text-center py-8 text-slate-400 text-xs font-bold">
              <div class="kitty-cat-mini mx-auto mb-1.5"></div>
              尚無事後補記記錄，在上方勾選學生即可隨時補記！
            </div>
          ` : `
            <div class="divide-y divide-pink-100 max-h-[260px] overflow-y-auto">
              ${retroEvents.map(e => {
                const s = this.store.getStudent(e.classId, e.seatNo);
                return `
                  <div class="py-2.5 flex items-center justify-between text-xs hover:bg-pink-50/40 px-2 rounded-xl transition">
                    <div class="flex items-center space-x-3">
                      <span class="font-mono font-bold text-slate-500 text-[11px]">${e.date} (${e.period !== undefined ? '第' + e.period + '節' : ''})</span>
                      <span class="font-black text-slate-900">${String(e.seatNo).padStart(2, '0')} 號 ${s ? s.name : ''}</span>
                      <span class="font-bold text-slate-700">${e.tagName}</span>
                      <span class="text-slate-500 truncate max-w-[200px] hidden sm:inline">${e.note || ''}</span>
                    </div>

                    <div class="flex items-center space-x-2">
                      <span class="font-black px-2 py-0.5 rounded-lg border ${e.delta > 0 ? 'color-rule-pos-badge' : e.delta < 0 ? 'color-rule-neg-badge' : 'color-rule-zero-badge'}">
                        ${e.delta > 0 ? '+' : ''}${e.delta}
                      </span>
                      <button onclick="retroLogView.deleteRetroEvent('${e.id}')" class="text-slate-400 hover:text-rose-600 transition" title="刪除記錄">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>

      </div>
    `;

    if (window.lucide) window.lucide.createIcons();
  }

  switchClass(classId) {
    this.currentClassId = classId;
    this.selectedSeats.clear();
    if (window.appState && window.appState.currentClassId !== classId) {
      window.appState.handleManualClassChange(classId);
    } else {
      this.render('retro-log-view');
    }
  }

  setDate(date) {
    this.selectedDate = date;
  }

  setPeriod(period) {
    this.selectedPeriod = parseInt(period, 10);
  }

  updateSelectionUI() {
    const students = this.store.getStudents(this.currentClassId);
    students.forEach(s => {
      const el = document.getElementById(`retro-student-${s.seatNo}`);
      if (el) {
        const isSelected = this.selectedSeats.has(s.seatNo);
        if (isSelected) {
          el.className = "cursor-pointer p-2.5 rounded-2xl border transition-all text-center select-none active:scale-95 bg-pink-500 text-white border-pink-600 shadow-md transform scale-[1.02] font-black";
          const sub = el.querySelector('.font-mono:last-child');
          if (sub) sub.className = "text-[10px] mt-1 font-mono text-pink-100";
        } else {
          el.className = "cursor-pointer p-2.5 rounded-2xl border transition-all text-center select-none active:scale-95 bg-white hover:bg-pink-50/60 border-pink-200 text-slate-800 font-bold";
          const sub = el.querySelector('.font-mono:last-child');
          if (sub) sub.className = "text-[10px] mt-1 font-mono text-slate-500";
        }
      }
    });

    const badge = document.getElementById('retro-selected-badge');
    if (badge) badge.innerText = `已選取 ${this.selectedSeats.size} 人`;

    const btnText = document.getElementById('retro-submit-btn-text');
    if (btnText) btnText.innerText = `✨ 立即 1 鍵批次補記 (${this.selectedSeats.size} 位學生)`;
  }

  updateTagUI() {
    const tags = this.store.getTagsSortedByClassFrequency(this.currentClassId);
    tags.forEach(t => {
      const btn = document.getElementById(`retro-tag-btn-${t.id}`);
      if (btn) {
        if (this.selectedTagId === t.id) {
          btn.className = "p-2 rounded-xl text-left border text-xs font-black transition flex items-center justify-between bg-pink-100 text-pink-900 border-pink-400 shadow-sm";
        } else {
          btn.className = "p-2 rounded-xl text-left border text-xs font-black transition flex items-center justify-between bg-slate-50 hover:bg-pink-50 text-slate-700 border-slate-200";
        }
      }
    });

    const deltaHeader = document.getElementById('retro-delta-header');
    if (deltaHeader) {
      deltaHeader.className = `text-[11px] font-bold ${this.customDelta > 0 ? 'text-emerald-600' : this.customDelta < 0 ? 'text-rose-600' : 'text-slate-500'}`;
      deltaHeader.innerText = `分值：${this.customDelta > 0 ? '+' : ''}${this.customDelta} 分`;
    }

    const deltaBadge = document.getElementById('retro-delta-badge');
    if (deltaBadge) {
      deltaBadge.className = `font-mono font-black text-xs px-2 py-0.5 rounded-lg border ${this.customDelta > 0 ? 'color-rule-pos-badge' : this.customDelta < 0 ? 'color-rule-neg-badge' : 'color-rule-zero-badge'}`;
      deltaBadge.innerText = `${this.customDelta > 0 ? '+' : ''}${this.customDelta}`;
    }
  }

  toggleSeat(seatNo) {
    if (this.selectedSeats.has(seatNo)) {
      this.selectedSeats.delete(seatNo);
    } else {
      this.selectedSeats.add(seatNo);
    }
    if (window.appState?.playPop) window.appState.playPop();
    this.updateSelectionUI();
  }

  selectAll() {
    const students = this.store.getStudents(this.currentClassId);
    students.forEach(s => this.selectedSeats.add(s.seatNo));
    if (window.appState?.playPop) window.appState.playPop();
    this.updateSelectionUI();
  }

  selectNone() {
    this.selectedSeats.clear();
    if (window.appState?.playPop) window.appState.playPop();
    this.updateSelectionUI();
  }

  selectGender(gender) {
    this.selectedSeats.clear();
    const students = this.store.getStudents(this.currentClassId);
    const total = students.length;
    students.forEach(s => {
      const studentGender = s.gender || (s.seatNo <= Math.ceil(total / 2) ? 'M' : 'F');
      if (studentGender === gender) {
        this.selectedSeats.add(s.seatNo);
      }
    });
    if (window.appState?.playPop) window.appState.playPop();
    this.updateSelectionUI();
  }

  selectOdd() {
    this.selectedSeats.clear();
    const students = this.store.getStudents(this.currentClassId);
    students.filter(s => s.seatNo % 2 !== 0).forEach(s => this.selectedSeats.add(s.seatNo));
    if (window.appState?.playPop) window.appState.playPop();
    this.updateSelectionUI();
  }

  selectEven() {
    this.selectedSeats.clear();
    const students = this.store.getStudents(this.currentClassId);
    students.filter(s => s.seatNo % 2 === 0).forEach(s => this.selectedSeats.add(s.seatNo));
    if (window.appState?.playPop) window.appState.playPop();
    this.updateSelectionUI();
  }

  selectTag(tagId) {
    this.selectedTagId = tagId;
    const tag = this.store.getTags(this.currentClassId).find(t => t.id === tagId);
    if (tag) {
      this.customDelta = tag.delta;
    }
    if (window.appState?.playPop) window.appState.playPop();
    this.updateTagUI();
  }

  adjustDelta(diff) {
    this.customDelta += diff;
    if (window.appState?.playPop) window.appState.playPop();
    this.updateTagUI();
  }

  applyTemplate(text) {
    this.customNote = text;
    const input = document.getElementById('retro-memo-input');
    if (input) input.value = text;
    if (window.appState?.playPop) window.appState.playPop();
  }

  submitBatch() {
    if (this.selectedSeats.size === 0) {
      window.appState.showToast('請至少選取 1 位學生進行補記！', 'warning');
      return;
    }

    const tag = this.store.getTags().find(t => t.id === this.selectedTagId) || {
      name: '課堂記點',
      category: 'discipline'
    };

    const seatsArray = Array.from(this.selectedSeats);
    seatsArray.forEach(seatNo => {
      this.store.addEvent({
        classId: this.currentClassId,
        seatNo,
        period: this.selectedPeriod,
        tagId: this.selectedTagId || 'custom_retro',
        tagName: tag.name,
        category: tag.category || 'discipline',
        delta: this.customDelta,
        severity: this.customDelta > 0 ? 'positive' : this.customDelta < 0 ? 'warning' : 'neutral',
        note: `[事後補記] ${this.customNote}`.trim(),
        date: this.selectedDate
      });
    });

    if (this.customDelta > 0 && window.appState?.playChime) {
      window.appState.playChime();
    } else if (this.customDelta < 0 && window.appState?.playWarning) {
      window.appState.playWarning();
    }

    window.appState.showToast(`🎉 成功為 ${seatsArray.length} 位學生完成事後補記 (${this.customDelta > 0 ? '+' : ''}${this.customDelta}分)！🎀`, 'success');

    // Reset selection
    this.selectedSeats.clear();
    this.customNote = '';
    this.render('retro-log-view');
  }

  deleteRetroEvent(eventId) {
    if (confirm('確定要刪除這筆事後補記記錄嗎？')) {
      this.store.deleteEvent(eventId);
      window.appState.showToast('已刪除記錄', 'info');
      this.render('retro-log-view');
    }
  }
}

// Global RetroLogView Instance
window.retroLogView = new RetroLogView(window.appStore);


/* === js/eventsLog.js === */
/**
 * Events Stream, Timeline & Comprehensive Incident Search/Log Hub
 * - Multi-View: 📋 列表檢索模式 (Table) | 📅 時序時間軸 (Timeline) | 👥 多生交叉事證查詢 (Cross-Student)
 * - ⏰ 課堂事後快速補記助手 (Retro-Logging Assistant)
 * - 1-Click Quick Scenario Presets & Weekly Retrospective
 */

class EventsLogView {
  constructor(store) {
    this.store = store;
    this.currentViewMode = 'timeline'; // 'timeline' | 'table' | 'cross'
    this.filterClass = 'all';
    this.filterCategory = 'all';
    this.filterSeverity = 'all';
    this.filterSeat = 'all';
    this.searchQuery = '';
    this.dateFrom = '';
    this.dateTo = '';
    this.crossSelectedSeats = new Set();
  }

  switchViewMode(mode) {
    this.currentViewMode = mode;
    this.render('events-log-view');
  }

  quickFilter(type) {
    const now = new Date();
    const sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];

    if (type === 'recent_neg') {
      this.dateFrom = sevenDaysAgo;
      this.dateTo = '';
      this.filterSeverity = 'warning';
      this.filterCategory = 'all';
      this.searchQuery = '';
    } else if (type === 'recent_pos') {
      this.dateFrom = sevenDaysAgo;
      this.dateTo = '';
      this.filterSeverity = 'positive';
      this.filterCategory = 'all';
      this.searchQuery = '';
    } else if (type === 'conflict') {
      this.dateFrom = '';
      this.dateTo = '';
      this.filterSeverity = 'all';
      this.filterCategory = 'conflict';
      this.searchQuery = '';
    } else if (type === 'retro') {
      this.dateFrom = '';
      this.dateTo = '';
      this.filterSeverity = 'all';
      this.filterCategory = 'all';
      this.searchQuery = '事後補記';
    } else if (type === 'reset') {
      this.dateFrom = '';
      this.dateTo = '';
      this.filterSeverity = 'all';
      this.filterCategory = 'all';
      this.filterClass = 'all';
      this.filterSeat = 'all';
      this.searchQuery = '';
      this.crossSelectedSeats.clear();
    }

    this.render('events-log-view');
  }

  toggleCrossSeat(seatNo) {
    if (this.crossSelectedSeats.has(seatNo)) {
      this.crossSelectedSeats.delete(seatNo);
    } else {
      this.crossSelectedSeats.add(seatNo);
    }
    this.render('events-log-view');
  }

  render(containerId, initialClassId = null) {
    const container = document.getElementById(containerId);
    if (!container) return;

    if (initialClassId && this.filterClass === 'all') {
      this.filterClass = initialClassId;
    }

    const classes = this.store.getClasses();
    let events = this.store.getEvents();
    const students = this.filterClass !== 'all' ? this.store.getStudents(this.filterClass) : [];

    // Apply Standard Filters
    if (this.filterClass !== 'all') {
      events = events.filter(e => e.classId === this.filterClass);
    }
    if (this.filterSeat !== 'all') {
      events = events.filter(e => e.seatNo === parseInt(this.filterSeat, 10));
    }
    if (this.filterCategory !== 'all') {
      events = events.filter(e => e.category === this.filterCategory);
    }
    if (this.filterSeverity !== 'all') {
      if (this.filterSeverity === 'warning') {
        events = events.filter(e => e.severity === 'warning' || e.severity === 'danger' || e.severity === 'critical' || (e.delta < 0));
      } else {
        events = events.filter(e => e.severity === this.filterSeverity);
      }
    }
    if (this.dateFrom) {
      events = events.filter(e => e.date >= this.dateFrom);
    }
    if (this.dateTo) {
      events = events.filter(e => e.date <= this.dateTo);
    }
    if (this.searchQuery) {
      const q = this.searchQuery.toLowerCase();
      events = events.filter(e => {
        const student = this.store.getStudent(e.classId, e.seatNo);
        const name = student ? student.name.toLowerCase() : '';
        const note = (e.note || '').toLowerCase();
        const tagName = (e.tagName || '').toLowerCase();
        const seat = String(e.seatNo);
        return name.includes(q) || note.includes(q) || tagName.includes(q) || seat === q;
      });
    }

    // Sort Chronologically (Newest first)
    events.sort((a, b) => {
      const dateDiff = new Date(b.date || '2026-01-01') - new Date(a.date || '2026-01-01');
      if (dateDiff !== 0) return dateDiff;
      return (b.period || 0) - (a.period || 0);
    });

    const isOAA = (window.appStore ? window.appStore.getTheme() : 'kitty') === 'oaa';

    container.innerHTML = `
      <div class="glass-card rounded-3xl p-5 sm:p-6 mb-5 ${isOAA ? 'border-2 border-amber-500/50 bg-[#240e1b]/95 text-white' : 'border border-pink-200 bg-white'} shadow-sm">
        <!-- Top Title & Action Buttons -->
        <div class="flex flex-wrap items-center justify-between gap-4 mb-5">
          <div class="flex items-center space-x-3.5">
            ${isOAA ? `
              <div class="w-12 h-12 rounded-2xl bg-rose-950 border-2 border-amber-400 shadow-md flex items-center justify-center text-2xl shrink-0">
                🏛️
              </div>
            ` : `
              <div class="sanrio-twinstars-badge !w-12 !h-12"></div>
            `}
            <div>
              <h2 class="text-xl sm:text-2xl font-black ${isOAA ? 'text-white' : 'text-slate-900'} flex items-center gap-2">
                ${isOAA ? '🏛️ 高度育成 學生日常事證與考評紀錄中心' : '學生事件記事與時序事證檢索中心'}
                ${isOAA ? '' : '<span class="kitty-bow"></span>'}
              </h2>
              <p class="text-xs sm:text-sm ${isOAA ? 'text-slate-200' : 'text-slate-600'} font-medium">
                ${isOAA ? 'S-SYSTEM 實力評價審查、課堂事後補記與時序事件軌跡' : '支援課堂事後回憶補記、多生交叉衝突查詢與日期時序時間軸'}
              </p>
            </div>
          </div>

          <div class="flex flex-wrap items-center space-x-2">
            <button onclick="eventsLogView.openAddEventModal('${this.filterClass !== 'all' ? this.filterClass : '801'}')" 
              class="px-4 py-2 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white text-xs sm:text-sm font-black shadow-md transition flex items-center gap-1.5">
              <i data-lucide="clock" class="w-4 h-4"></i> ⏰ 事後快速補記
            </button>
            <button onclick="eventsLogView.exportFilteredSummary()" class="px-3.5 py-2 rounded-2xl ${isOAA ? 'bg-[#1b0a14] hover:bg-rose-950 text-amber-200 border border-amber-500/40' : 'bg-white hover:bg-pink-50 text-slate-800 border border-pink-300'} text-xs sm:text-sm font-bold flex items-center gap-1.5 transition shadow-sm">
              <i data-lucide="copy" class="w-4 h-4 text-pink-500"></i> 複製搜尋結果
            </button>
          </div>
        </div>

        <!-- View Mode Switcher Tabs -->
        <div class="flex items-center justify-between border-b ${isOAA ? 'border-amber-500/30' : 'border-pink-200'} pb-3 mb-4">
          <div class="flex items-center space-x-2">
            <button onclick="eventsLogView.switchViewMode('timeline')" class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-black transition flex items-center gap-1.5 ${this.currentViewMode === 'timeline' ? (isOAA ? 'bg-gradient-to-r from-rose-900 to-rose-800 text-amber-200 border border-amber-400 shadow-sm' : 'bg-pink-600 text-white shadow-sm') : (isOAA ? 'bg-[#1b0a14] text-slate-200 hover:bg-rose-950 border border-amber-500/40' : 'bg-pink-50 text-pink-700 hover:bg-pink-100')}">
              <i data-lucide="calendar" class="w-4 h-4"></i> 📅 日期時序時間軸
            </button>
            <button onclick="eventsLogView.switchViewMode('table')" class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-black transition flex items-center gap-1.5 ${this.currentViewMode === 'table' ? (isOAA ? 'bg-gradient-to-r from-rose-900 to-rose-800 text-amber-200 border border-amber-400 shadow-sm' : 'bg-pink-600 text-white shadow-sm') : (isOAA ? 'bg-[#1b0a14] text-slate-200 hover:bg-rose-950 border border-amber-500/40' : 'bg-pink-50 text-pink-700 hover:bg-pink-100')}">
              <i data-lucide="list" class="w-4 h-4"></i> 📋 完整列表模式
            </button>
            <button onclick="eventsLogView.switchViewMode('cross')" class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-black transition flex items-center gap-1.5 ${this.currentViewMode === 'cross' ? (isOAA ? 'bg-gradient-to-r from-rose-900 to-rose-800 text-amber-200 border border-amber-400 shadow-sm' : 'bg-pink-600 text-white shadow-sm') : (isOAA ? 'bg-[#1b0a14] text-slate-200 hover:bg-rose-950 border border-amber-500/40' : 'bg-pink-50 text-pink-700 hover:bg-pink-100')}">
              <i data-lucide="users" class="w-4 h-4"></i> 👥 多生交叉查詢
            </button>
          </div>
          <span class="text-xs ${isOAA ? 'text-amber-200/80 font-mono' : 'text-slate-500 font-bold'} hidden sm:inline">共 ${events.length} 筆符合事證</span>
        </div>

        <!-- 1-Click Quick Scenario Presets -->
        <div class="flex flex-wrap items-center gap-2 mb-4 pb-3 border-b border-pink-100">
          <span class="text-xs font-black text-slate-700">⚡ 一鍵情境速查：</span>
          <button onclick="eventsLogView.quickFilter('retro')" class="px-3 py-1 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-300 text-xs font-bold transition flex items-center gap-1">
            <i data-lucide="clock" class="w-3.5 h-3.5 text-amber-600"></i> ⏰ 所有事後補記
          </button>
          <button onclick="eventsLogView.quickFilter('recent_neg')" class="px-3 py-1 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-800 border border-rose-300 text-xs font-bold transition flex items-center gap-1">
            <i data-lucide="alert-triangle" class="w-3.5 h-3.5 text-rose-600"></i> 🔥 近 7 日違紀
          </button>
          <button onclick="eventsLogView.quickFilter('recent_pos')" class="px-3 py-1 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-300 text-xs font-bold transition flex items-center gap-1">
            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-emerald-600"></i> 🌟 近 7 日優異
          </button>
          <button onclick="eventsLogView.quickFilter('conflict')" class="px-3 py-1 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-800 border border-purple-300 text-xs font-bold transition flex items-center gap-1">
            <i data-lucide="shield-alert" class="w-3.5 h-3.5 text-purple-600"></i> ⚠️ 同儕衝突
          </button>
          <button onclick="eventsLogView.quickFilter('reset')" class="px-3 py-1 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 text-xs font-bold transition flex items-center gap-1">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> 重設
          </button>
        </div>

        <!-- Filter Controls Bar -->
        <div class="p-4 rounded-2xl bg-pink-50/60 border border-pink-200 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-5">
          <!-- Class Filter -->
          <div>
            <label class="block text-xs text-slate-700 font-bold mb-1">班級篩選</label>
            <select onchange="eventsLogView.setFilter('filterClass', this.value)" class="w-full border border-pink-300 rounded-xl px-3 py-2 text-xs sm:text-sm font-bold focus:outline-none bg-white">
              <option value="all" ${this.filterClass === 'all' ? 'selected' : ''}>所有班級</option>
              ${Object.values(classes).map(c => `
                <option value="${c.id}" ${this.filterClass === c.id ? 'selected' : ''}>${c.name} (${c.type === 'homeroom' ? '導師' : '科任'})</option>
              `).join('')}
            </select>
          </div>

          <!-- Seat Filter -->
          <div>
            <label class="block text-xs text-slate-700 font-bold mb-1">座號篩選</label>
            <select onchange="eventsLogView.setFilter('filterSeat', this.value)" class="w-full border border-pink-300 rounded-xl px-3 py-2 text-xs sm:text-sm font-bold focus:outline-none bg-white">
              <option value="all" ${this.filterSeat === 'all' ? 'selected' : ''}>所有學生</option>
              ${students.map(s => `
                <option value="${s.seatNo}" ${this.filterSeat === String(s.seatNo) ? 'selected' : ''}>
                  ${String(s.seatNo).padStart(2, '0')} 號 ${s.name}
                </option>
              `).join('')}
            </select>
          </div>

          <!-- Category Filter -->
          <div>
            <label class="block text-xs text-slate-700 font-bold mb-1">類別</label>
            <select onchange="eventsLogView.setFilter('filterCategory', this.value)" class="w-full border border-pink-300 rounded-xl px-3 py-2 text-xs sm:text-sm font-bold focus:outline-none bg-white">
              <option value="all" ${this.filterCategory === 'all' ? 'selected' : ''}>所有類別</option>
              <option value="academic" ${this.filterCategory === 'academic' ? 'selected' : ''}>數學學業</option>
              <option value="discipline" ${this.filterCategory === 'discipline' ? 'selected' : ''}>生活常規</option>
              <option value="conflict" ${this.filterCategory === 'conflict' ? 'selected' : ''}>同儕衝突</option>
              <option value="social" ${this.filterCategory === 'social' ? 'selected' : ''}>熱心助人/日常記事</option>
            </select>
          </div>

          <!-- Date Range (From) -->
          <div>
            <label class="block text-xs text-slate-700 font-bold mb-1">起始日期</label>
            <input type="date" value="${this.dateFrom}" onchange="eventsLogView.setFilter('dateFrom', this.value)" class="w-full border border-pink-300 rounded-xl px-2.5 py-1.5 text-xs sm:text-sm font-bold focus:outline-none bg-white">
          </div>

          <!-- Date Range (To) -->
          <div>
            <label class="block text-xs text-slate-700 font-bold mb-1">結束日期</label>
            <input type="date" value="${this.dateTo}" onchange="eventsLogView.setFilter('dateTo', this.value)" class="w-full border border-pink-300 rounded-xl px-2.5 py-1.5 text-xs sm:text-sm font-bold focus:outline-none bg-white">
          </div>

          <!-- Keyword Search -->
          <div>
            <label class="block text-xs text-slate-700 font-bold mb-1">關鍵字全文搜尋</label>
            <input type="text" placeholder="如：打架/感冒/作業..." value="${this.searchQuery}" oninput="eventsLogView.setSearch(this.value)" class="w-full border border-pink-300 rounded-xl px-3 py-1.5 text-xs sm:text-sm font-bold focus:outline-none bg-white">
          </div>
        </div>

        <!-- VIEW MODE CONTENT RENDERING -->
        ${this.renderViewContent(events, students)}

      </div>
    `;

    if (window.lucide) window.lucide.createIcons();
  }

  renderViewContent(events, students) {
    if (this.currentViewMode === 'cross') {
      return this.renderCrossStudentQuery(events, students);
    } else if (this.currentViewMode === 'timeline') {
      return this.renderTimelineView(events);
    } else {
      return this.renderTableView(events);
    }
  }

  // --- 1. Chronological Timeline View (📅 日期時序時間軸) ---
  renderTimelineView(events) {
    if (events.length === 0) {
      return `
        <div class="py-12 text-center text-slate-400">
          <div class="kitty-cat-mini mx-auto mb-2"></div>
          <div class="text-sm font-bold">查無符合條件之時序記錄</div>
        </div>
      `;
    }

    // Group events by Date
    const grouped = {};
    events.forEach(e => {
      const d = e.date || '未指定日期';
      if (!grouped[d]) grouped[d] = [];
      grouped[d].push(e);
    });

    const isOAA = (window.appStore ? window.appStore.getTheme() : 'kitty') === 'oaa';

    return `
      <div class="space-y-6 relative before:absolute before:inset-0 before:left-3.5 before:w-0.5 ${isOAA ? 'before:bg-amber-500/30' : 'before:bg-pink-200'}">
        ${Object.keys(grouped).map(date => `
          <div class="relative pl-8">
            <!-- Date Pill Node -->
            <div class="absolute left-0 top-0.5 w-7 h-7 rounded-full ${isOAA ? 'bg-rose-900 border-2 border-amber-400 text-amber-300' : 'bg-pink-500 border-4 border-white text-white'} shadow-sm flex items-center justify-center text-[10px] font-black">
              ${isOAA ? '🏛️' : '📅'}
            </div>
            
            <div class="mb-2 flex items-center gap-2">
              <h3 class="text-sm sm:text-base font-black ${isOAA ? 'text-amber-300' : 'text-pink-700'} font-mono">${date}</h3>
              <span class="text-[11px] px-2 py-0.5 rounded-full ${isOAA ? 'bg-rose-950 text-amber-200 border border-amber-500/40' : 'bg-pink-100 text-pink-800'} font-bold">當日共 ${grouped[date].length} 筆記事</span>
            </div>

            <!-- Events Cards on this Date -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              ${grouped[date].map(evt => {
                const student = this.store.getStudent(evt.classId, evt.seatNo);
                const isPos = evt.delta > 0;
                const isZero = evt.delta === 0;
                const clsInfo = this.store.getClass(evt.classId);
                const isRetro = (evt.note || '').includes('事後補記');

                return `
                  <div class="p-3.5 rounded-2xl border-2 ${isPos ? 'border-emerald-200 bg-emerald-50/40' : isZero ? 'border-slate-200 bg-slate-50/40' : 'border-rose-200 bg-rose-50/40'} shadow-sm relative">
                    <div class="flex items-center justify-between mb-1.5">
                      <div class="flex items-center space-x-1.5">
                        <span class="px-2 py-0.5 rounded-lg text-xs font-black bg-white border border-pink-200 text-slate-800">
                          ${clsInfo ? clsInfo.name : evt.classId}
                        </span>
                        <span class="font-black text-slate-900 text-sm">
                          ${String(evt.seatNo).padStart(2, '0')} 號 ${student ? student.name : '學生'}
                        </span>
                        ${isRetro ? '<span class="text-[10px] px-1.5 py-0.2 rounded-md bg-amber-100 text-amber-800 font-bold border border-amber-300">⏰ 事後補記</span>' : ''}
                      </div>

                      <span class="font-black px-2.5 py-0.5 rounded-lg text-xs border ${isPos ? 'color-rule-pos-badge' : isZero ? 'color-rule-zero-badge' : 'color-rule-neg-badge'}">
                        ${evt.delta > 0 ? '+' : ''}${evt.delta}
                      </span>
                    </div>

                    <div class="text-xs font-bold text-slate-800 mb-1 flex items-center gap-1">
                      <span class="text-pink-600">🏷️ ${evt.tagName || '自訂記事'}</span>
                      <span class="text-slate-400 font-normal">（節次 ${evt.period !== undefined ? evt.period : '無'}）</span>
                    </div>

                    <p class="text-xs text-slate-700 font-medium leading-relaxed bg-white/80 p-2 rounded-xl border border-pink-100 mb-2">
                      ${evt.note || '<span class="text-slate-400">無詳細備註</span>'}
                    </p>

                    <div class="flex items-center justify-end space-x-2">
                      <button onclick="eventsLogView.deleteEvent('${evt.id}')" class="text-slate-400 hover:text-rose-600 text-xs font-bold transition flex items-center gap-0.5">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> 刪除
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  // --- 2. Multi-Student Cross-Query View (👥 多生交叉查詢) ---
  renderCrossStudentQuery(events, students) {
    if (this.filterClass === 'all') {
      return `
        <div class="p-8 text-center text-slate-500 bg-pink-50/50 rounded-2xl border border-pink-200">
          <div class="text-sm font-bold">請先在上方「班級篩選」選擇指定班級，即可勾選多位學生進行交叉事證比對</div>
        </div>
      `;
    }

    const selectedArray = Array.from(this.crossSelectedSeats);
    const crossEvents = events.filter(e => selectedArray.length === 0 || selectedArray.includes(e.seatNo));

    return `
      <div>
        <!-- Student Multiselect Chips -->
        <div class="mb-5 p-3.5 rounded-2xl bg-pink-50 border border-pink-200">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-black text-slate-800 flex items-center gap-1.5">
              <i data-lucide="user-check" class="w-4 h-4 text-pink-600"></i>
              勾選 2 位以上學生進行交叉事件查詢 (例如同儕衝突雙方、同組合作名單)：
            </span>
            <span class="text-xs text-pink-600 font-bold">已選 ${selectedArray.length} 人</span>
          </div>

          <div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-1.5">
            ${students.map(s => {
              const isChecked = this.crossSelectedSeats.has(s.seatNo);
              return `
                <button onclick="eventsLogView.toggleCrossSeat(${s.seatNo})" 
                  class="px-2 py-1.5 rounded-xl border text-xs font-bold transition text-left truncate flex items-center justify-between ${isChecked ? 'bg-pink-600 text-white border-pink-700 shadow-sm' : 'bg-white text-slate-800 border-pink-200 hover:bg-pink-100'}">
                  <span>${String(s.seatNo).padStart(2, '0')} ${s.name}</span>
                  ${isChecked ? '✓' : ''}
                </button>
              `;
            }).join('')}
          </div>
        </div>

        <!-- Cross Query Result Header -->
        <div class="mb-3 text-xs font-black text-slate-700">
          【交叉比對結果：共 ${crossEvents.length} 筆事證】
        </div>

        <!-- Cross Table -->
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs sm:text-sm text-slate-800">
            <thead class="bg-pink-100 text-pink-900 uppercase text-xs font-black border-b border-pink-200">
              <tr>
                <th class="py-3 px-3.5">日期 / 節次</th>
                <th class="py-3 px-3.5">座號 / 姓名</th>
                <th class="py-3 px-3.5">行為標籤</th>
                <th class="py-3 px-3 text-center">積分</th>
                <th class="py-3 px-4">事證備忘</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-pink-100">
              ${crossEvents.length === 0 ? `
                <tr>
                  <td colspan="5" class="py-8 text-center text-slate-400">查無所選學生之交集記錄</td>
                </tr>
              ` : crossEvents.map(evt => {
                const student = this.store.getStudent(evt.classId, evt.seatNo);
                return `
                  <tr class="hover:bg-pink-50/50 transition">
                    <td class="py-3 px-3.5 whitespace-nowrap font-mono font-bold">${evt.date} (節次${evt.period || '無'})</td>
                    <td class="py-3 px-3.5 whitespace-nowrap font-black text-slate-900">
                      ${String(evt.seatNo).padStart(2, '0')} 號 ${student ? student.name : '學生'}
                    </td>
                    <td class="py-3 px-3.5 whitespace-nowrap font-bold">${evt.tagName || '記事'}</td>
                    <td class="py-3 px-3 text-center font-black ${evt.delta > 0 ? 'text-emerald-700' : evt.delta < 0 ? 'text-rose-700' : 'text-slate-500'}">
                      ${evt.delta > 0 ? '+' : ''}${evt.delta}
                    </td>
                    <td class="py-3 px-4 text-slate-700">${evt.note || ''}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  // --- 3. Standard Table View (📋 完整列表模式) ---
  renderTableView(events) {
    return `
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs sm:text-sm text-slate-800">
          <thead class="bg-pink-100 text-pink-900 uppercase text-xs font-black border-b border-pink-200">
            <tr>
              <th class="py-3 px-3.5">日期 / 節次</th>
              <th class="py-3 px-3.5">班級</th>
              <th class="py-3 px-3.5">座號 / 姓名</th>
              <th class="py-3 px-3.5">行為標籤</th>
              <th class="py-3 px-3 text-center">積分變動</th>
              <th class="py-3 px-4">具體事實備忘 (事證)</th>
              <th class="py-3 px-3 text-right">操作</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-pink-100">
            ${events.length === 0 ? `
              <tr>
                <td colspan="7" class="py-12 text-center text-slate-400">
                  <div class="kitty-cat-mini mx-auto mb-2"></div>
                  <div class="text-sm font-bold">查無符合條件之記事或事件記錄</div>
                </td>
              </tr>
            ` : events.map(evt => {
              const student = this.store.getStudent(evt.classId, evt.seatNo);
              const isPos = evt.delta > 0;
              const isZero = evt.delta === 0;
              const clsInfo = this.store.getClass(evt.classId);

              return `
                <tr class="hover:bg-pink-50/50 transition">
                  <td class="py-3 px-3.5 whitespace-nowrap">
                    <span class="font-mono font-bold text-slate-800">${evt.date}</span>
                    <span class="block text-[10px] text-slate-500 font-bold">${evt.time || ''} (節次 ${evt.period !== undefined ? evt.period : '無'})</span>
                  </td>
                  <td class="py-3 px-3.5 whitespace-nowrap">
                    <span class="px-2 py-0.5 rounded-lg text-xs font-bold ${clsInfo?.type === 'homeroom' ? 'bg-pink-100 text-pink-700' : 'bg-sky-100 text-sky-700'}">
                      ${clsInfo ? clsInfo.name : evt.classId}
                    </span>
                  </td>
                  <td class="py-3 px-3.5 whitespace-nowrap">
                    <span class="font-black text-slate-900 text-sm">${String(evt.seatNo).padStart(2, '0')} 號</span>
                    <span class="font-bold text-slate-800 ml-1.5">${student ? student.name : '學生'}</span>
                  </td>
                  <td class="py-3 px-3.5 whitespace-nowrap font-bold text-slate-800">
                    ${evt.tagName || '自訂記事'}
                  </td>
                  <td class="py-3 px-3 text-center whitespace-nowrap">
                    <span class="font-black px-2 py-0.5 rounded-lg text-xs border ${isPos ? 'color-rule-pos-badge' : isZero ? 'color-rule-zero-badge' : 'color-rule-neg-badge'}">
                      ${evt.delta > 0 ? '+' : ''}${evt.delta}
                    </span>
                  </td>
                  <td class="py-3 px-4 max-w-xs md:max-w-md font-medium text-slate-700">
                    ${evt.note || '<span class="text-slate-400">無備註</span>'}
                  </td>
                  <td class="py-3 px-3 text-right whitespace-nowrap">
                    <button onclick="eventsLogView.deleteEvent('${evt.id}')" class="p-1 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-rose-50 transition" title="刪除此筆記錄">
                      <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  setFilter(key, value) {
    this[key] = value;
    this.render('events-log-view');
  }

  setSearch(val) {
    this.searchQuery = val.trim();
    this.render('events-log-view');
  }

  deleteEvent(eventId) {
    if (confirm('確定要刪除此筆事件記錄嗎？')) {
      this.store.deleteEvent(eventId);
      window.appState.showToast('已刪除該筆記事', 'info');
      this.render('events-log-view');
      if (window.matrixView) window.matrixView.render('classroom-matrix-view', window.appState.currentClassId);
    }
  }

  openAddEventModal(classId) {
    if (window.matrixView?.openRetroLogModal) {
      window.matrixView.openRetroLogModal(classId);
    }
  }

  exportFilteredSummary() {
    let events = this.store.getEvents();
    if (this.filterClass !== 'all') events = events.filter(e => e.classId === this.filterClass);
    if (this.filterSeat !== 'all') events = events.filter(e => e.seatNo === parseInt(this.filterSeat, 10));
    if (this.filterCategory !== 'all') events = events.filter(e => e.category === this.filterCategory);
    if (this.dateFrom) events = events.filter(e => e.date >= this.dateFrom);
    if (this.dateTo) events = events.filter(e => e.date <= this.dateTo);

    let report = `【ClassQuant 學生事件與記事摘錄】\n篩選範圍：${this.filterClass === 'all' ? '所有班級' : this.filterClass + '班'} (共 ${events.length} 筆)\n\n`;
    events.forEach((e, idx) => {
      const student = this.store.getStudent(e.classId, e.seatNo);
      report += `${idx + 1}. [${e.date} 節次:${e.period}] ${e.classId}班 ${String(e.seatNo).padStart(2, '0')}號 ${student ? student.name : '學生'}：【${e.tagName} (${e.delta > 0 ? '+' : ''}${e.delta})】${e.note ? ' - ' + e.note : ''}\n`;
    });

    navigator.clipboard.writeText(report);
    window.appState.showToast(`已複製 ${events.length} 筆事證至剪貼簿！`, 'success');
  }
}

/**
 * Student Individual Dossier & Counseling Report View
 * Dual-mode: Sanrio Standard Mode & [OAA Mode] (Classroom of the Elite Style)
 */

class StudentDossierView {
  constructor(store, stats, charts) {
    this.store = store;
    this.stats = stats;
    this.charts = charts;
    this.currentClassId = '801';
    this.currentSeatNo = 1;
  }

  isOAAMode() {
    const globalTheme = window.appStore ? window.appStore.getTheme() : 'kitty';
    return globalTheme === 'oaa';
  }

  // --- Calculate Grounded OAA Metrics (Firmly derived from store data) ---
  calculateOAA(student, classId, profile, events) {
    const cls = this.store.getClass(classId);
    const isHomeroom = cls ? cls.type === 'homeroom' : (classId === '801');

    // 1. 学力 (Academic Ability, 0-100)
    // Derived from assessment scores mean, plus academic tags
    let academicScore = 75;
    let testCount = 0;
    if (profile && profile.scoreMean > 0) {
      academicScore = profile.scoreMean;
      testCount = profile.assessmentsCount || (profile.scores ? profile.scores.length : 1);
    } else {
      // If no assessment yet, calculate net academic tags from events
      const acadEvents = events.filter(e => e.category === 'academic' || e.category === 'assessment');
      const netAcad = acadEvents.reduce((sum, e) => sum + (Number(e.delta) || 0) * 2, 0);
      academicScore = Math.min(100, Math.max(0, 75 + netAcad));
    }
    academicScore = Math.round(academicScore);

    // 2. 規律服従 (Discipline & Obedience, 0-100)
    // Derived from discipline tags, cleaning chores (掃除), and conflict deductions
    let obedienceBase = 75;
    let posDiscCount = 0;
    let negDiscCount = 0;

    events.forEach(e => {
      const isCleaning = e.tagName && (e.tagName.includes('掃除') || e.tagName.includes('整潔') || e.id === 'disc_clean_fail');
      const isDiscipline = e.category === 'discipline' || isCleaning;
      const isConflict = e.category === 'conflict';

      if (isDiscipline) {
        if (e.delta > 0) {
          obedienceBase += Number(e.delta) * 2;
          posDiscCount++;
        } else {
          obedienceBase += Number(e.delta) * 2.5; // Stricter deduction
          negDiscCount++;
        }
      } else if (isConflict) {
        obedienceBase += Number(e.delta) * 3; // Severe deduction for conflict
        negDiscCount++;
      }
    });
    const obedienceScore = Math.min(100, Math.max(0, Math.round(obedienceBase)));

    let metrics = [];
    let rawWeighted = 0;

    if (isHomeroom) {
      // 🏫 導師班：4 維考核（学力 40%, 規律服従 35%, 身体能力 15%, 協作表現 10%）

      // 3. 身体能力 (Physical Ability, 0-100)
      let physicalBase = 75;
      let physCount = 0;
      events.forEach(e => {
        const isPhys = e.tagName && (e.tagName.includes('體育') || e.tagName.includes('競賽') || e.tagName.includes('運動') || e.tagName.includes('跑'));
        if (isPhys) {
          physicalBase += Number(e.delta) * 3;
          physCount++;
        }
      });
      const physicalScore = Math.min(100, Math.max(0, Math.round(physicalBase)));

      // 4. 協作表現 (Social & Cooperation, 0-100)
      let coopBase = 75;
      let coopCount = 0;
      events.forEach(e => {
        const isCoop = e.category === 'social' || (e.tagName && (e.tagName.includes('助人') || e.tagName.includes('幹部') || e.tagName.includes('小老師')));
        if (isCoop) {
          coopBase += Number(e.delta) * 2.5;
          coopCount++;
        }
      });
      const coopScore = Math.min(100, Math.max(0, Math.round(coopBase)));

      metrics = [
        { key: 'academic', label: '学力', score: academicScore, grade: this.getLetterGrade(academicScore), weight: '40%', detail: testCount > 0 ? `採計 ${testCount} 次測驗平均 ${academicScore} 分` : `基礎 75 分，尚無測驗紀錄` },
        { key: 'physical', label: '身体能力', score: physicalScore, grade: this.getLetterGrade(physicalScore), weight: '15%', detail: physCount > 0 ? `體育與體能紀錄 ${physCount} 筆` : `基準 75 分，常態表現` },
        { key: 'obedience', label: '規律服従', score: obedienceScore, grade: this.getLetterGrade(obedienceScore), weight: '35%', detail: `常規與掃除紀錄：加點 ${posDiscCount} 次、違規 ${negDiscCount} 次` },
        { key: 'cooperation', label: '協作表現', score: coopScore, grade: this.getLetterGrade(coopScore), weight: '10%', detail: coopCount > 0 ? `熱心助人與幹部服務 ${coopCount} 筆` : `基準 75 分，常態表現` }
      ];

      rawWeighted = (academicScore * 0.40) + (obedienceScore * 0.35) + (physicalScore * 0.15) + (coopScore * 0.10);

    } else {
      // 📐 數學科任班：3 維考核（学力 55%, 課堂服従 30%, 思考解題 15% • 絕無體育）

      // 3. 思考解題 (Problem Solving & Response, 0-100)
      let thinkBase = 75;
      let thinkCount = 0;
      events.forEach(e => {
        const isThink = e.id === 'math_breakthrough' || e.id === 'math_board' || e.id === 'math_ask' || (e.tagName && (e.tagName.includes('難題') || e.tagName.includes('板書') || e.tagName.includes('提問')));
        if (isThink) {
          thinkBase += Number(e.delta) * 3;
          thinkCount++;
        }
      });
      const thinkScore = Math.min(100, Math.max(0, Math.round(thinkBase)));

      metrics = [
        { key: 'academic', label: '学力', score: academicScore, grade: this.getLetterGrade(academicScore), weight: '55%', detail: testCount > 0 ? `採計 ${testCount} 次數學測驗平均 ${academicScore} 分` : `基礎 75 分，尚無測驗紀錄` },
        { key: 'thinking', label: '思考解題', score: thinkScore, grade: this.getLetterGrade(thinkScore), weight: '15%', detail: thinkCount > 0 ? `上台解題與主動提問 ${thinkCount} 筆` : `基準 75 分，課堂常態` },
        { key: 'obedience', label: '課堂服従', score: obedienceScore, grade: this.getLetterGrade(obedienceScore), weight: '30%', detail: `數學課堂專注與作業繳交率` }
      ];

      rawWeighted = (academicScore * 0.55) + (obedienceScore * 0.30) + (thinkScore * 0.15);
    }

    // --- 硬核卡階限制規則 (Gating Rules) ---
    let finalScore = Math.round(rawWeighted);
    let gatingNote = null;

    // S 級卡階：總分 >= 90，但学力未達 85 或 服從未達 75
    if (finalScore >= 90) {
      if (academicScore < 85) {
        finalScore = 89;
        gatingNote = '学力未達 85 分 (A級)，受實力至上考核限制，強制卡階於 A+';
      } else if (obedienceScore < 75) {
        finalScore = 89;
        gatingNote = '服從紀律未達 75 分基準，綜合評價強制卡階於 A+';
      }
    }

    // A 級卡階：總分 >= 80，但学力不及格 (< 60)
    if (finalScore >= 80 && academicScore < 60) {
      finalScore = 79;
      gatingNote = '学力低於及格線 (60分)，綜合評價強制卡階於 B+';
    }

    const overallGrade = this.getLetterGrade(finalScore);

    // Narrative Profile Synthesis (高度育成風格評語)
    const sorted = [...metrics].sort((a, b) => b.score - a.score);
    const topMetric = sorted[0];
    const lowestMetric = sorted[sorted.length - 1];

    let oaaSummary = '';
    if (finalScore >= 90) {
      oaaSummary = `該生在【${topMetric.label}】展現出統治級的適應力與卓越水準。整體綜合數值極高，已具備引領班級的領袖才能。若能在【${lowestMetric.label}】維持高標準，將成為無可忽視的頂尖實力者。`;
    } else if (finalScore >= 80) {
      oaaSummary = `該生在各項考核中表現優異，尤其在【${topMetric.label}】方面表現突出，為班級中堅核心。目前主要弱項在於【${lowestMetric.label}】，若能補足此項缺口，整體實力評估將能更上層樓。`;
    } else if (finalScore >= 70) {
      oaaSummary = `該生整體數值穩定，作風中規中矩。在【${topMetric.label}】具備一定底蘊，但需注意防範【${lowestMetric.label}】帶來的短板拉扯效應，避免在後續高難度考核中落入劣勢。`;
    } else {
      oaaSummary = `數據顯示目前處於高警戒觀察區間，特別在【${lowestMetric.label}】存在明顯赤字。需立即擬定針對性補救策略與常規約束，方能扭轉個人與班級評價。`;
    }

    return {
      isHomeroom,
      metrics,
      rawWeighted,
      finalScore,
      overallGrade,
      gatingNote,
      oaaSummary
    };
  }

  getLetterGrade(val) {
    if (val >= 95) return 'S+';
    if (val >= 90) return 'S';
    if (val >= 85) return 'A+';
    if (val >= 80) return 'A';
    if (val >= 75) return 'B+';
    if (val >= 70) return 'B';
    if (val >= 65) return 'C+';
    if (val >= 60) return 'C';
    if (val >= 50) return 'D';
    return 'E';
  }

  // --- Main Render Function ---
  render(containerId, classId = null, seatNo = null) {
    const container = document.getElementById(containerId);
    if (!container) return;

    if (classId) {
      this.currentClassId = classId;
    } else if (window.appState?.currentClassId) {
      this.currentClassId = window.appState.currentClassId;
    }
    if (!this.currentClassId) {
      this.currentClassId = Object.keys(this.store.getClasses())[0] || '801';
    }
    if (seatNo) this.currentSeatNo = parseInt(seatNo, 10);

    const classes = this.store.getClasses();
    let students = this.store.getStudents(this.currentClassId);
    if (!students || students.length === 0) {
      const fallbackId = Object.keys(classes)[0];
      if (fallbackId && fallbackId !== this.currentClassId) {
        this.currentClassId = fallbackId;
        students = this.store.getStudents(this.currentClassId);
      }
    }
    const student = this.store.getStudent(this.currentClassId, this.currentSeatNo) || (students && students[0]);

    if (!student) {
      container.innerHTML = `<div class="p-12 text-center text-slate-500 font-bold">查無學生資料</div>`;
      return;
    }

    this.currentSeatNo = student.seatNo;
    const profile = this.stats.getStudentProfile(this.currentClassId, student.seatNo);
    const events = this.store.getEvents(this.currentClassId).filter(e => e.seatNo === student.seatNo);
    const oaa = this.calculateOAA(student, this.currentClassId, profile, events);

    if (this.isOAAMode()) {
      this.renderOAAMode(container, student, classes, students, profile, events, oaa);
    } else {
      this.renderDefaultMode(container, student, classes, students, profile, events, oaa);
    }

    if (window.lucide) window.lucide.createIcons();
  }

  // --- 📊 Compute Formative Assessment Points Breakdown by Category and Tag ---
  computeStudentPointsBreakdown(events) {
    let academic = { count: 0, delta: 0 };
    let discipline = { count: 0, delta: 0 };
    let social = { count: 0, delta: 0 };
    let conflict = { count: 0, delta: 0 };
    const tagMap = {};

    events.forEach(e => {
      const delta = Number(e.delta) || 0;
      const cat = e.category || 'discipline';
      if (cat === 'academic' || cat === 'assessment') {
        academic.count++;
        academic.delta += delta;
      } else if (cat === 'social') {
        social.count++;
        social.delta += delta;
      } else if (cat === 'conflict') {
        conflict.count++;
        conflict.delta += delta;
      } else {
        discipline.count++;
        discipline.delta += delta;
      }

      const tagName = e.tagName || (delta > 0 ? '加點' : '扣點');
      if (!tagMap[tagName]) {
        tagMap[tagName] = { count: 0, delta: 0, category: cat };
      }
      tagMap[tagName].count++;
      tagMap[tagName].delta += delta;
    });

    const tagsList = Object.entries(tagMap).map(([name, data]) => ({
      name,
      ...data
    })).sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta) || b.count - a.count);

    return {
      academic,
      discipline,
      social,
      conflict,
      totalDelta: academic.delta + discipline.delta + social.delta + conflict.delta,
      totalCount: events.length,
      tagsList
    };
  }

  showMetricTooltip(label, grade, score, weight, detail) {

  generateCounselingSynthesis(profile, events) {
    let recommendation = '';
    if (profile.scoreMean >= 85 && profile.scoreSlope >= 0) {
      recommendation = '數理邏輯領悟力強，建議適度給予競賽題或延伸閱讀以拔尖，並可安排擔任數學小老師協助同儕。';
    } else if (profile.scoreMean < 60) {
      recommendation = '目前基礎運算觀念尚有斷層，建議每日安排 3~5 題基礎核心題型建立信心，並避免挫折感加劇。';
    } else if (profile.scoreSlope < -2) {
      recommendation = '近期小考成績有明顯下滑波動，需關心是否課後分心、作息混亂或家庭/同儕壓力。';
    } else {
      recommendation = '學習狀態維持常態，建議保持課前預習與確實訂正習慣，持續肯定其常規穩定性。';
    }
    return { recommendation };
  }

  toggleStudentGender() {
    if (!this.currentClassId || !this.currentSeatNo) return;
    const newGender = this.store.toggleStudentGender(this.currentClassId, this.currentSeatNo);
    window.appState.showToast(`已將座號 ${this.currentSeatNo} 切換為【${newGender === 'F' ? '👧 女生' : '👦 男生'}】`, 'success');

    // If matrix view is active or rendered, update it
    if (window.classroomMatrix) {
      window.classroomMatrix.render('matrix-view', this.currentClassId);
    }
  }

  switchClass(classId) {
    this.currentClassId = classId;
    const students = this.store.getStudents(classId);
    this.currentSeatNo = students[0] ? students[0].seatNo : 1;
    if (window.appState && window.appState.currentClassId !== classId) {
      window.appState.handleManualClassChange(classId);
    } else {
      this.render('student-dossier-view', this.currentClassId, this.currentSeatNo);
    }
  }

  switchStudent(seatNo) {
    this.currentSeatNo = parseInt(seatNo, 10);
    this.render('student-dossier-view', this.currentClassId, this.currentSeatNo);
  }

  copyCounselingMemo() {
    const box = document.getElementById('counseling-memo-box');
    if (box) {
      navigator.clipboard.writeText(box.innerText);
      window.appState.showToast('已複製家長晤談備忘錄！', 'success');
    }
  }
}

/**
 * Timetable & Schedule Management View
 * Weekly grid editor, period times adjuster, and real-time schedule simulator.
 */

class TimetableEditorView {
  constructor(store, timetable) {
    this.store = store;
    this.timetable = timetable;
  }

  render(containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;

    const periods = this.store.data.timetablePeriods;
    const weeklySchedule = this.store.data.weeklySchedule;
    const classes = this.store.getClasses();
    const activeSlot = this.timetable.detectActiveSlot();
    const { day: curDay, timeStr: curTime, isSimulated } = this.timetable.getCurrentTimeInfo();

    const days = [
      { id: 1, name: '週一' },
      { id: 2, name: '週二' },
      { id: 3, name: '週三' },
      { id: 4, name: '週四' },
      { id: 5, name: '週五' }
    ];

    container.innerHTML = `
      <!-- Top Bar & Simulation Testing -->
      <div class="glass-card rounded-xl p-5 mb-5 border border-slate-700/60">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
          <div>
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
              <i data-lucide="calendar" class="w-5 h-5 text-sky-400"></i>
              教師個人每週授課課表管理
            </h2>
            <p class="text-xs text-slate-400">系統將依據此課表在真實授課時段自動為您載入對應班級與模式</p>
          </div>

          <!-- Current Schedule Status Chip -->
          <div class="flex items-center gap-3">
            <div class="px-3.5 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-xs flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full ${activeSlot.status === 'in_session' ? 'bg-emerald-400 live-indicator' : 'bg-amber-400'}"></span>
              <span class="text-slate-300 font-medium">${activeSlot.message}</span>
            </div>
          </div>
        </div>

        <!-- Timetable Time Simulation Bar (Great for testing!) -->
        <div class="p-3.5 rounded-xl bg-slate-900/80 border border-slate-800 flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center space-x-2 text-xs text-slate-300">
            <i data-lucide="sliders" class="w-4 h-4 text-amber-400"></i>
            <span class="font-bold">時間感知模擬器 (快速測試自動切換)：</span>
          </div>

          <div class="flex items-center space-x-2">
            <select id="sim-day-select" class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-slate-200 focus:outline-none">
              <option value="1" ${curDay === 1 ? 'selected' : ''}>週一</option>
              <option value="2" ${curDay === 2 ? 'selected' : ''}>週二</option>
              <option value="3" ${curDay === 3 ? 'selected' : ''}>週三</option>
              <option value="4" ${curDay === 4 ? 'selected' : ''}>週四</option>
              <option value="5" ${curDay === 5 ? 'selected' : ''}>週五</option>
            </select>

            <input type="time" id="sim-time-input" value="${curTime}" class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-slate-200 focus:outline-none">

            <button onclick="timetableEditorView.applySimulation()" class="px-3 py-1 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-xs font-semibold transition">
              設定模擬時間
            </button>

            ${isSimulated ? `
              <button onclick="timetableEditorView.clearSimulation()" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg text-xs font-medium transition">
                恢復真實時間
              </button>
            ` : ''}
          </div>
        </div>
      </div>

      <!-- Weekly Schedule Grid -->
      <div class="glass-card rounded-xl p-5 border border-slate-700/60 overflow-x-auto mb-6">
        <table class="w-full text-center text-xs text-slate-300 border-collapse">
          <thead>
            <tr class="bg-slate-900/80 text-slate-400 text-xs border-b border-slate-700">
              <th class="py-3 px-3 w-32 text-left">節次 / 時間</th>
              ${days.map(d => `
                <th class="py-3 px-3 font-bold text-slate-200 ${curDay === d.id ? 'bg-sky-600/15 text-sky-300' : ''}">
                  ${d.name} ${curDay === d.id ? '(今日)' : ''}
                </th>
              `).join('')}
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800">
            ${periods.map(p => {
              const isSpecial = p.period === 'lunch' || p.period === 'clean';
              const isCurrentPeriod = activeSlot.period === p.period;

              return `
                <tr class="${isSpecial ? 'bg-slate-900/40 text-slate-500' : 'hover:bg-slate-800/30'} ${isCurrentPeriod ? 'timetable-current-slot' : ''}">
                  <!-- Period Header -->
                  <td class="py-3 px-3 text-left font-mono">
                    <div class="font-bold text-slate-200">${p.name}</div>
                    <div class="text-[10px] text-slate-500">${p.start} - ${p.end}</div>
                  </td>

                  <!-- Monday to Friday Slots -->
                  ${days.map(d => {
                    const assignedClassId = weeklySchedule[d.id]?.[p.period] || '';
                    const cls = classes[assignedClassId];

                    if (isSpecial) {
                      return `<td class="py-2 px-2 text-[11px] text-slate-500">${p.name}</td>`;
                    }

                    return `
                      <td class="py-2 px-2">
                        <select onchange="timetableEditorView.updateSlot(${d.id}, '${p.period}', this.value)"
                          class="w-full py-1.5 px-2 rounded-lg text-xs font-bold text-center border transition focus:outline-none ${assignedClassId ? (cls && cls.type === 'homeroom' ? 'bg-purple-900/30 text-purple-200 border-purple-500/40 hover:bg-purple-900/50' : 'bg-sky-900/30 text-sky-200 border-sky-500/40 hover:bg-sky-900/50') : 'bg-slate-900/40 text-slate-600 border-dashed border-slate-800 hover:border-slate-600'}">
                          <option value="">-- 空堂/備課 --</option>
                          ${Object.values(classes).map(c => `
                            <option value="${c.id}" ${assignedClassId === c.id ? 'selected' : ''}>
                              ${c.name} (${c.type === 'homeroom' ? '導師' : '數學'})
                            </option>
                          `).join('')}
                        </select>
                      </td>
                    `;
                  }).join('')}
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;

    if (window.lucide) window.lucide.createIcons();
  }

  updateSlot(day, period, classId) {
    const weeklySchedule = { ...this.store.data.weeklySchedule };
    if (!weeklySchedule[day]) weeklySchedule[day] = {};

    if (classId) {
      weeklySchedule[day][period] = classId;
    } else {
      delete weeklySchedule[day][period];
    }

    this.store.updateWeeklySchedule(weeklySchedule);
    window.appState.showToast(`已更新週課表設定`, 'success');
    this.render('timetable-editor-view');
  }

  applySimulation() {
    const day = parseInt(document.getElementById('sim-day-select').value, 10);
    const timeStr = document.getElementById('sim-time-input').value;
    this.timetable.setSimulationTime(day, timeStr);
    window.appState.showToast(`已設定模擬時間：週${['', '一', '二', '三', '四', '五'][day]} ${timeStr}`, 'info');
    this.render('timetable-editor-view');
    window.appState.updateHeaderStatus();
  }

  clearSimulation() {
    this.timetable.clearSimulation();
    window.appState.showToast('已恢復真實系統時間感知', 'info');
    this.render('timetable-editor-view');
    window.appState.updateHeaderStatus();
  }
}

// Global Timetable Editor Instance
window.timetableEditorView = new TimetableEditorView(window.appStore, window.timetableEngine);

class AIService {
  constructor() {

    this.encryptedKey = 'cWMceVIKYHYGeWpKAh9naWVAS3pxBnpxZVx7T1ZWCgwHRgdoVwBYfAlVeQx3amR6aX9UFWE=';

  static encrypt(plainText, passcode = '0228') {
    let result = '';
    for (let i = 0; i < plainText.length; i++) {
      result += String.fromCharCode(plainText.charCodeAt(i) ^ passcode.charCodeAt(i % passcode.length));

  static decrypt(ciphertext, passcode = '0228') {
    try {
      const raw = atob(ciphertext);
      let result = '';
      for (let i = 0; i < raw.length; i++) {
        result += String.fromCharCode(raw.charCodeAt(i) ^ passcode.charCodeAt(i % passcode.length));
      }
      return result;
    } catch (e) {
      return '';
    }
  }

  isFamilyAuthorized() {
    return localStorage.getItem('classquant_family_authorized') === 'true';
  }

  getApiKey() {
    // 1. Silent URL parameter check (?setup_key=... or ?api_key=...)
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const queryKey = urlParams.get('setup_key') || urlParams.get('api_key');
      if (queryKey && queryKey.trim()) {
        const trimmed = queryKey.trim();
        localStorage.setItem('classquant_gemini_api_key', trimmed);
        const cleanUrl = window.location.origin + window.location.pathname;
        window.history.replaceState({}, document.title, cleanUrl);
        return trimmed;
      }
    } catch (e) {}

    // 2. User/device custom key
    const customKey = localStorage.getItem('classquant_gemini_api_key');
    if (customKey && customKey.trim()) return customKey.trim();

    // 3. Family authorized key (decrypted from encrypted master key)
    if (this.isFamilyAuthorized() && this.encryptedKey) {
      const decrypted = AIService.decrypt(this.encryptedKey, '0228');
      if (decrypted) return decrypted;
    }

    return '';
  }

  setApiKey(key) {
    localStorage.setItem('classquant_gemini_api_key', (key || '').trim());
  }

  clearApiKey() {
    localStorage.removeItem('classquant_gemini_api_key');
    localStorage.removeItem('classquant_family_authorized');
  }

  hasApiKey() {
    return Boolean(this.getApiKey());
  }

  verifyFamilyPasscode(passcode) {
    if ((passcode || '').trim() === '0228') {
      localStorage.setItem('classquant_family_authorized', 'true');
      if (this.encryptedKey) {
        const decrypted = AIService.decrypt(this.encryptedKey, '0228');
        if (decrypted) {
          localStorage.setItem('classquant_gemini_api_key', decrypted);
        }
      }
      return true;
    }
    return false;
  }

  async generateContent({ prompt, systemInstruction, responseSchema, images = [] }) {
    const key = this.getApiKey();
    if (!key) throw new Error('AUTH_REQUIRED');
    if (!navigator.onLine) throw new Error('OFFLINE');

    const parts = [];
    images.forEach(img => {
      parts.push({
        inlineData: {
          mimeType: img.mimeType || 'image/jpeg',
          data: img.data
        }
      });
    });
    parts.push({ text: prompt });

    const requestBody = {
      contents: [{ parts }]
    };

    if (systemInstruction) {
      requestBody.systemInstruction = {
        parts: [{ text: systemInstruction }]
      };
    }

    if (responseSchema) {
      requestBody.generationConfig = {
        responseMimeType: "application/json",
        responseSchema: responseSchema
      };
    }

    let modelName = 'gemini-3.6-flash';
    let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${key}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(requestBody)
    });

    if (!response.ok && response.status === 404) {
      modelName = 'gemini-2.5-flash';
      response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${key}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(requestBody)
      });
    }

    if (!response.ok) {
      const errJson = await response.json().catch(() => ({}));
      throw new Error(errJson.error?.message || `HTTP ${response.status} 錯誤`);
    }

    const data = await response.json();
    const candidate = data.candidates?.[0];
    if (!candidate || !candidate.content?.parts?.[0]?.text) {
      throw new Error('Gemini API 未回傳有效解析內容');
    }

    return candidate.content.parts[0].text;
  }
}

  executeImport() {
    const text = document.getElementById('import-text-area').value.trim();
    if (!text) {
      window.appState.showToast('請先貼入欲匯入之 JSON 或 CSV 內容', 'warning');
      return;
    }

    // Try parsing as JSON first
    if (text.startsWith('{') || text.startsWith('[')) {
      try {
        const parsed = JSON.parse(text);

        // Case 1: Assessment Import
        if (parsed.type === 'assessment' || parsed.records) {
          const classId = parsed.class_id || window.appState.currentClassId;
          const scoresMap = {};
          (parsed.records || []).forEach(r => {
            scoresMap[r.seat_no] = Number(r.score);
          });

          this.store.addAssessment(classId, {
            name: parsed.assessment_name || '外部匯入小考',
            date: parsed.date || new Date().toISOString().split('T')[0],
            maxScore: parsed.max_score || 100,
            scores: scoresMap
          });

          window.appState.showToast(`🎉 成功匯入【${parsed.assessment_name || '小考'}】成績（共 ${Object.keys(scoresMap).length} 位學生）！`, 'success');
          this.clearImportArea();
          return;
        }

        // Case 2: Full System Backup Import
        if (parsed.classes && parsed.students) {
          const res = this.store.importAllData(text);
          if (res.success) {
            window.appState.showToast('🎉 成功載入全系統備份資料！', 'success');
            setTimeout(() => location.reload(), 800);
            return;
          } else {
            window.appState.showToast(`匯入失敗：${res.error}`, 'danger');
            return;
          }
        }

        window.appState.showToast('無法識別此 JSON 規格，請參考上方格式', 'warning');
      } catch (err) {
        window.appState.showToast(`JSON 解析失敗：${err.message}`, 'danger');
      }
      return;
    }

    // Try CSV Parsing
    try {
      const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length > 1) {
        let importedCount = 0;
        // Check if header exists
        const startIdx = lines[0].toLowerCase().includes('date') ? 1 : 0;
        for (let i = startIdx; i < lines.length; i++) {
          const cols = lines[i].split(',').map(c => c.trim().replace(/^"|"$/g, ''));
          if (cols.length >= 6) {
            this.store.addEvent({
              date: cols[0],
              period: cols[1],
              classId: cols[2],
              seatNo: parseInt(cols[3], 10),
              category: cols[4] || 'discipline',
              tagName: cols[5] || '外部匯入事件',
              delta: Number(cols[6] || 0),
              severity: cols[7] || 'info',
              note: cols[8] || ''
            });
            importedCount++;
          }
        }
        window.appState.showToast(`🎉 成功由 CSV 匯入 ${importedCount} 筆事件記錄！`, 'success');
        this.clearImportArea();
        return;
      }
      window.appState.showToast('CSV 行數過少或格式不正確', 'warning');
    } catch (e) {
      window.appState.showToast(`CSV 解析失敗：${e.message}`, 'danger');
    }
  }

  exportClassStatsCsv() {
    const currentClassId = window.appState.currentClassId;
    const students = this.store.getStudents(currentClassId);
    const cls = this.store.getClass(currentClassId);
    
    let csv = `座號,姓名,學業均分,常規淨積分,學習動機,責任感,同儕互動\n`;
    students.forEach(s => {
      const p = window.statisticsEngine.getStudentProfile(currentClassId, s.seatNo);
      const charPts = p ? p.pointsBreakdown.discipline + p.pointsBreakdown.conflict + p.pointsBreakdown.social : 0;
      csv += `${s.seatNo},"${s.name}",${p ? p.scoreMean : 0},${charPts},${p ? p.radar.motivation : 70},${p ? p.radar.accountability : 70},${p ? p.radar.socialEmotional : 70}\n`;
    });

    const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${cls ? cls.name : currentClassId}_全班統計報表.csv`;
    a.click();
    window.appState.showToast('已匯出班級統計 CSV 報表！', 'success');
  }

  // --- Core Gemini 2.5 Flash Grade Conversion Engine ---
  async convertGradesWithGemini() {
    if (!navigator.onLine) {
      window.appState.showToast('⚠️ 目前處於離線狀態，AI 智慧辨識需連上網路！', 'danger');
      return;
    }

    if (!window.aiService.hasApiKey()) {
      window.appState.showToast('🔑 尚未解鎖或設定 AI 金鑰，請先回答親友通關密語！', 'info');
      this.openApiKeyModal();
      return;
    }

    const classId = document.getElementById('ai-gemini-class-select')?.value || window.appState.currentClassId;
    const examName = document.getElementById('ai-gemini-exam-name')?.value.trim() || '隨堂測驗';
    const examDate = document.getElementById('ai-gemini-exam-date')?.value || new Date().toISOString().split('T')[0];
    const maxScore = Number(document.getElementById('ai-gemini-max-score')?.value) || 100;
    const rawText = document.getElementById('ai-gemini-raw-text')?.value.trim();

    if (!rawText && !this.selectedImageBase64) {
      window.appState.showToast('⚠️ 請輸入成績文字，或拍照/附加成績單圖片！', 'danger');
      return;
    }

    const convertBtn = document.getElementById('ai-gemini-convert-btn');
    const originalBtnText = convertBtn ? convertBtn.innerHTML : '';
    if (convertBtn) {
      convertBtn.disabled = true;
      convertBtn.innerHTML = `<span class="animate-spin mr-1">⏳</span> 正在呼叫 Gemini 2.5 Flash 解析中...`;
    }

    try {
      const images = [];
      if (this.selectedImageBase64) {
        images.push({
          mimeType: this.selectedImageMime || 'image/jpeg',
          data: this.selectedImageBase64
        });
      }

      const promptText = `
你是一位專業的台灣國中教務與評量數據分析助理。
請從使用者提供的學生測驗成績記錄（文字或圖片）中，精確抽取每位學生的成績資料。

【測驗背景資訊】：
- 班級編號：${classId}
- 測驗名稱：${examName}
- 測驗滿分：${maxScore}
- 測驗日期：${examDate}

【輸入內容】：
${rawText || '(請見所附成績單圖片)'}

【規則】：
1. seat_no: 座號 (必須為 1 以上之整數)。
2. score: 分數 (數字，0 ~ ${maxScore}。若學生註記缺考、公假、未考，請填 0 並在 note 註明「缺考」)。
3. note: 備註 (若無備註可填空字串 "")。
4. 請嚴格依照 JSON Schema 格式輸出。
`;

      const responseSchema = {
        type: "OBJECT",
        properties: {
          assessment_name: { type: "STRING" },
          max_score: { type: "NUMBER" },
          records: {
            type: "ARRAY",
            items: {
              type: "OBJECT",
              properties: {
                seat_no: { type: "INTEGER" },
                score: { type: "NUMBER" },
                note: { type: "STRING" }
              },
              required: ["seat_no", "score"]
            }
          }
        },
        required: ["records"]
      };

      const resultText = await window.aiService.generateContent({
        prompt: promptText,
        systemInstruction: "你是一位專業的台灣國中教務與評量數據分析助理。請嚴格輸出符合 Schema 的 JSON 格式。",
        responseSchema,
        images
      });

      const resultJson = JSON.parse(resultText);
      const records = resultJson.records || [];

      if (records.length === 0) {
        throw new Error('未能在文字或圖片中辨識出任何學生座號與分數');
      }

      // Sort by seat_no ascending
      records.sort((a, b) => a.seat_no - b.seat_no);

      // Open confirmation preview modal
      this.openGradePreviewModal({
        classId,
        examName: resultJson.assessment_name || examName,
        examDate,
        maxScore: resultJson.max_score || maxScore,
        records
      });

    } catch (err) {
      console.error('Gemini conversion error:', err);
      if (err.message === 'AUTH_REQUIRED') {
        window.appState.showToast('🔑 尚未解鎖 AI 服務，請先回答親友通關密語！', 'info');
        this.openApiKeyModal();
      } else {
        window.appState.showToast(`❌ AI 轉換失敗：${err.message}`, 'danger');
      }
    } finally {
      if (convertBtn) {
        convertBtn.disabled = false;
        convertBtn.innerHTML = originalBtnText;
      }
    }
  }

            <tbody class="divide-y divide-pink-100 bg-white">

                return `

            ✕ 放棄重試

          <button onclick="aiHub.confirmAndSaveGrades('${classId}', '${encodeURIComponent(examName)}', '${examDate}', ${maxScore}, ${encodeURIComponent(JSON.stringify(records.map(r => r.seat_no)))})" class="px-6 py-2.5 rounded-2xl bg-gradient-to-r from-emerald-500 via-teal-500 to-emerald-600 hover:from-emerald-600 hover:to-teal-700 text-white text-xs sm:text-sm font-black shadow-lg hover:shadow-xl transition active:scale-95 flex items-center gap-1.5 cursor-pointer">

  confirmAndSaveGrades(classId, encodedName, examDate, maxScore, encodedSeatNos) {
    const examName = decodeURIComponent(encodedName);
    const seatNos = JSON.parse(decodeURIComponent(encodedSeatNos));

    const scoresMap = {};
    const notesMap = {};

    seatNos.forEach(sNo => {
      const scoreInput = document.getElementById(`preview-score-${sNo}`);
      const noteInput = document.getElementById(`preview-note-${sNo}`);
      if (scoreInput) {
        scoresMap[sNo] = Number(scoreInput.value) || 0;
      }
      if (noteInput && noteInput.value.trim()) {
        notesMap[sNo] = noteInput.value.trim();
      }
    });

    // 1. Create safety snapshot before writing
    this.store.createSnapshot(`AI 智慧匯入小考：${examName}`);

    // 2. Save assessment into store

      maxScore: maxScore,
      scores: scoresMap,
      notes: notesMap
    });

    this.closeGlobalModal();

/**
 * ClassQuant Hub - Feedback Board Component (v1.9.6)
 * 互動留言板：使用者意見回饋、功能建議與開發者回覆
 */

class FeedbackBoard {
  constructor(store) {
    this.store = store;
    this.currentFilter = 'all';
    this.feedbacks = [];
    this.storageKey = 'classquant_feedback_list';
    this.webhookStorageKey = 'classquant_feedback_webhook_url';
    this.cloudConfig = null;
    this.isSyncing = false;
    this.lastSyncTime = null;
    this.init();
  }

  async init() {
    this.loadFromStorage();
    // Clean up any legacy dummy sample data
    const cleaned = this.feedbacks.filter(f => !f.id || (!f.id.startsWith('fb-welcome-') && !f.id.startsWith('fb-sample-')));
    if (cleaned.length !== this.feedbacks.length) {
      this.feedbacks = cleaned;
      this.saveToStorage();
    }

    await this.loadCloudConfig();

    if (this.feedbacks.length === 0) {
      await this.loadInitialData();
    }

    // Auto-sync in background if online or on local server
    if (navigator.onLine || location.protocol.startsWith('http')) {
      this.syncFeedbacks(true);
    }
  }

  async loadCloudConfig() {
    try {
      const res = await fetch('./data/cloud_config.json?t=' + Date.now());
      if (res.ok) {
        this.cloudConfig = await res.json();
        if (this.cloudConfig && this.cloudConfig.webhookUrl) {
          const localWh = localStorage.getItem(this.webhookStorageKey);
          if (!localWh || localWh.trim().length === 0) {
            this.setWebhookUrl(this.cloudConfig.webhookUrl);
          }
        }
      }
    } catch (e) {
      // Offline or file not found
    }
  }

  loadFromStorage() {
    try {
      const raw = localStorage.getItem(this.storageKey);
      if (raw) {
        this.feedbacks = JSON.parse(raw);
      }
    } catch (e) {
      console.warn('Failed to parse local feedback data:', e);
      this.feedbacks = [];
    }
  }

  saveToStorage() {
    try {
      localStorage.setItem(this.storageKey, JSON.stringify(this.feedbacks));
    } catch (e) {
      console.error('Failed to save feedback data:', e);
    }
  }

  async loadInitialData() {
    try {
      const res = await fetch('./data/feedback.json?t=' + Date.now());
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data)) {
          // Exclude any legacy sample data
          this.feedbacks = data.filter(f => !f.id || (!f.id.startsWith('fb-welcome-') && !f.id.startsWith('fb-sample-')));
          this.saveToStorage();
        }
      }
    } catch (e) {
      console.log('Feedback data load error:', e);
    }
  }

  isDeveloper() {
    return window.aiService && window.aiService.isFamilyAuthorized();
  }

  getWebhookUrl() {
    return localStorage.getItem(this.webhookStorageKey) || (this.cloudConfig?.webhookUrl || '');
  }

  setWebhookUrl(url) {
    if (url) {
      localStorage.setItem(this.webhookStorageKey, url.trim());
    } else {
      localStorage.removeItem(this.webhookStorageKey);
    }
  }

  // --- Two-Way Feedbacks Synchronization (Local Server + Cloud Google Sheets) ---
  async syncFeedbacks(silent = true) {
    if (this.isSyncing) return;
    this.isSyncing = true;
    this.updateSyncUIStatus('syncing');

    let remoteItems = [];
    let sourceUsed = '';

    // 1. Try Local Dev Server API (serve.ps1: /api/feedback)
    if (location.protocol.startsWith('http')) {
      try {
        const res = await fetch('./api/feedback?t=' + Date.now());
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data)) {
            remoteItems = data;
            sourceUsed = 'local_api';
          }
        }
      } catch (e) {}
    }

    // 2. Try Google Apps Script Cloud Endpoint if Webhook is set and online
    const webhookUrl = this.getWebhookUrl();
    if (webhookUrl && navigator.onLine) {
      try {
        const sep = webhookUrl.includes('?') ? '&' : '?';
        const res = await fetch(`${webhookUrl}${sep}action=get&t=${Date.now()}`);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            const map = new Map();
            remoteItems.forEach(item => map.set(item.id, item));
            data.forEach(item => map.set(item.id, item));
            remoteItems = Array.from(map.values());
            sourceUsed = 'cloud_api';
          }
        }
      } catch (e) {
        console.log('Cloud Webhook GET error:', e);
      }
    }

    // 3. Fallback to static ./data/feedback.json if nothing fetched and local is empty
    if (remoteItems.length === 0 && this.feedbacks.length === 0) {
      await this.loadInitialData();
    }

    // 4. Merge remoteItems into this.feedbacks
    if (remoteItems.length > 0) {
      const mergedMap = new Map();
      this.feedbacks.forEach(item => mergedMap.set(item.id, item));
      remoteItems.forEach(rem => {
        const local = mergedMap.get(rem.id);
        if (!local) {
          mergedMap.set(rem.id, rem);
        } else {
          // If remote has reply and local does not, use remote
          if (rem.reply && !local.reply) {
            mergedMap.set(rem.id, rem);
          } else if (rem.likes > (local.likes || 0)) {
            local.likes = rem.likes;
            mergedMap.set(rem.id, local);
          }
        }
      });
      this.feedbacks = Array.from(mergedMap.values());
      this.feedbacks = this.feedbacks.filter(f => !f.id || (!f.id.startsWith('fb-welcome-') && !f.id.startsWith('fb-sample-')));
      this.saveToStorage();

      // If on local server and we have items that server didn't have, push them to /api/feedback
      if (location.protocol.startsWith('http') && this.feedbacks.length > 0) {
        try {
          await fetch('./api/feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(this.feedbacks)
          });
        } catch (e) {}
      }
    }

    this.lastSyncTime = new Date();
    this.isSyncing = false;
    this.updateSyncUIStatus('done');
    this.render('feedback-board-view');

    if (!silent) {
      const srcName = sourceUsed === 'cloud_api' ? '雲端 Google 試算表' : (sourceUsed === 'local_api' ? '本機測試伺服器' : '快取');
      window.appState.showToast(`✅ 已從【${srcName}】同步完成 (共 ${this.feedbacks.length} 則)`, 'success');
    }
  }

  // --- Broadcast New or Updated Entry to All Endpoints ---
  async broadcastEntry(entry) {
    // 1. Send to Local Dev Server (serve.ps1 /api/feedback)
    if (location.protocol.startsWith('http')) {
      try {
        await fetch('./api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(entry)
        });
      } catch (e) {
        console.log('Local API broadcast error:', e);
      }
    }

    // 2. Send to Google Apps Script Webhook
    const webhookUrl = this.getWebhookUrl();
    if (webhookUrl && navigator.onLine) {
      try {
        await fetch(webhookUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(entry)
        });
      } catch (e) {
        console.log('Cloud Webhook broadcast error:', e);
      }
    }
  }
