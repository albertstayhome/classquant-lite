<!DOCTYPE html>
<html lang="zh-TW" data-theme="kitty">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ClassQuant Hub • 國中導師與數學科任戰情室</title>
  
  <!-- PWA Metadata -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#f43f5e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ClassQuant">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23f43f5e'/%3E%3Cpath d='M30 45 C30 35 40 28 50 28 C60 28 70 35 70 45 C70 58 60 65 50 65 C40 65 30 58 30 45 Z' fill='%23ffffff'/%3E%3Cellipse cx='42' cy='46' rx='3' ry='4.5' fill='%23222'/%3E%3Cellipse cx='58' cy='46' rx='3' ry='4.5' fill='%23222'/%3E%3Cellipse cx='50' cy='53' rx='3.5' ry='2.5' fill='%23fbbf24'/%3E%3Cpath d='M62 32 C65 26 74 26 77 31 C79 35 75 40 70 39 C72 44 68 49 63 47 C58 45 59 38 62 32 Z' fill='%23ef4444'/%3E%3Ccircle cx='66' cy='36' r='3.5' fill='%23ffedd5'/%3E%3C/svg%3E">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Chart.js CDN with BoxPlot Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@sgratzl/chartjs-chart-boxplot@4.2.4/build/index.umd.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts: Zen Maru Gothic & Nunito for Kawaii look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/kitty-theme.css">
  <link rel="stylesheet" href="./css/sanrio-characters.css">
  <link rel="stylesheet" href="./css/oaa-theme.css?v=1.9.22">
</head>
<body class="min-h-screen flex flex-col transition-colors duration-300 font-sans selection:bg-pink-300 selection:text-pink-900">

  <!-- Unified Sticky Top Bar Container (Header Row 1 + Navigation Tab Row 2) -->
  <div id="top-bar-sticky-container" class="sticky top-0 z-40 bg-white/80 backdrop-blur-md">
    
    <!-- Top Global Header with Collapsible Mascot Banner (Row 1 on Desktop, 2 Rows on Mobile) -->
    <header id="global-header" class="glass-card border-b px-2.5 sm:px-6 py-2">
      <div class="max-w-7xl mx-auto space-y-2 md:space-y-0 md:flex md:items-center md:justify-between md:gap-3">
        
        <!-- Mobile Row 1 / Desktop Left: Mascots, Title, Version Badge & Mobile Collapse Button -->
        <div class="flex items-center justify-between gap-1.5 min-w-0">
          <div class="flex items-center space-x-1 sm:space-x-2 min-w-0 flex-1 overflow-hidden">
            <!-- Sanrio Mascots Box (Hidden in OAA Mode) -->
            <div id="header-mascots-box" class="flex items-center space-x-1 bg-white px-1.5 py-0.5 rounded-2xl shadow-sm border border-pink-200 shrink-0">
              <div class="kitty-cat-avatar cursor-pointer !w-7 !h-7 sm:!w-8 sm:!h-8" onclick="appState.showToast('Hello Kitty 陪伴老師一起快樂教學！🎀', 'info')" title="Hello Kitty"></div>
              <div class="sanrio-twinstars-badge cursor-pointer !w-7 !h-7 sm:!w-8 sm:!h-8" onclick="appState.showToast('小雙星 Kiki & Lala 守護班級每一顆星星！✨', 'info')" title="Little Twin Stars (Kiki & Lala)"></div>
            </div>

            <!-- COTE Official Logo Box (Visible in OAA Mode, Click to Trigger Easter Egg!) -->
            <div id="header-cote-logo-box" onclick="appState.triggerCoteEasterEgg()" class="hidden items-center space-x-1.5 shrink-0 cursor-pointer active:scale-95 transition" title="高度育成 S-SYSTEM 內部終端（點擊解鎖動漫彩蛋）">
              <img src="./assets/cote/cote_logo.webp" alt="ようこそ実力至上主義の教室へ" class="h-6 sm:h-7 max-w-[105px] object-contain drop-shadow">
            </div>

            <!-- App Title & Version Badge -->
            <div class="flex items-center space-x-1 shrink-0">
              <h1 id="app-title-text" class="text-xs sm:text-base font-black tracking-wide flex items-center gap-1 text-pink-600 shrink-0 whitespace-nowrap">
                ClassQuant
                <span class="kitty-bow !w-3 !h-3 sm:!w-3.5 sm:!h-3.5 shrink-0"></span>
              </h1>
              <button id="header-version-badge" onclick="appState.openBulletinModal()" class="text-[10px] px-1.5 py-0.5 rounded-full font-bold bg-pink-100 text-pink-700 border border-pink-300 hover:bg-pink-200 transition active:scale-95 cursor-pointer flex items-center gap-0.5 shrink-0 whitespace-nowrap" title="查看公佈欄與更新日誌">
                <span>v1.9.22</span>
                <span>📢</span>
              </button>
            </div>
          </div>

          <!-- Mobile Only: Prominent Collapse Button on Top-Right Corner (Fixed shrink-0, never overlaps version badge) -->
          <button onclick="appState.toggleHeader()" 
            class="md:hidden px-2 py-0.5 rounded-xl border border-pink-300 bg-pink-100 hover:bg-pink-200 text-pink-800 font-black text-xs transition flex items-center gap-0.5 shadow-sm shrink-0 active:scale-90 cursor-pointer whitespace-nowrap ml-1" title="收合頂部選單">
            <i data-lucide="chevron-up" class="w-3.5 h-3.5"></i>
            <span>收合</span>
          </button>
        </div>

        <!-- Mobile Row 2 / Desktop Right: Class Selector Dropdown & Quick Control Tools -->
        <div class="flex items-center justify-between gap-2">
          <!-- Class Select Dropdown (Spacious & Clean, Never Truncated) -->
          <div class="flex items-center space-x-1.5 border border-pink-300 rounded-xl px-2.5 py-1 shadow-inner bg-white min-w-[125px] flex-1 max-w-[260px] sm:max-w-none">
            <i data-lucide="users" class="w-3.5 h-3.5 text-pink-500 shrink-0"></i>
            <select id="global-class-select" onchange="appState.handleManualClassChange(this.value)" 
              class="bg-transparent text-xs sm:text-sm font-bold focus:outline-none cursor-pointer w-full text-slate-800 truncate pr-1">
              <!-- Populated via JS -->
            </select>
          </div>

          <!-- Quick Tools & Desktop Collapse Button -->
          <div class="flex items-center space-x-1 sm:space-x-1.5 shrink-0">
            <!-- Clock Ticker (Desktop only) -->
            <div class="hidden xl:flex items-center space-x-1 text-[11px] opacity-80 mr-1">
              <span id="header-live-clock" class="font-mono font-semibold">載入時間...</span>
              <span>•</span>
              <div id="header-schedule-status" class="flex items-center space-x-1">
                <span class="w-2 h-2 rounded-full bg-emerald-500 live-indicator"></span>
                <span class="text-emerald-600 font-bold">自動感知</span>
              </div>
            </div>

            <!-- Onboarding Tour Button (Desktop & Tablet) -->
            <button id="onboarding-guide-btn" onclick="onboardingTour.start(0)" 
              class="hidden sm:flex px-2 py-1 rounded-xl border border-pink-300 bg-white hover:bg-pink-50 text-pink-700 transition items-center gap-1 shadow-sm active:scale-95 shrink-0" title="開啟新手教學">
              <span class="text-xs font-black">🎓</span>
              <span class="text-xs font-bold text-pink-700 hidden md:inline">新手教學</span>
            </button>

            <!-- Sound Toggle Button -->
            <button id="sound-toggle-btn" onclick="appState.toggleSound()" 
              class="p-1.5 rounded-xl border border-pink-300 hover:bg-pink-50 transition flex items-center gap-1 shadow-sm bg-white shrink-0" title="操作音效切換">
              <i data-lucide="volume-2" class="w-4 h-4 text-pink-600"></i>
            </button>

            <!-- Theme Switcher Button (Sanrio vs OAA Mode) -->
            <button id="theme-toggle-btn" onclick="appState.toggleTheme()" 
              class="p-1.5 rounded-xl border border-pink-300 hover:bg-pink-50 transition flex items-center gap-1 shadow-sm bg-white shrink-0 cursor-pointer" title="切換風格主題 (三麗鷗 ⇋ OAA模式)">
              <span class="kitty-bow !w-3.5 !h-3.5"></span>
              <span class="text-xs font-bold text-pink-600 ml-0.5 hidden xl:inline">三麗鷗</span>
            </button>

            <!-- Font Scale Switcher Button -->
            <button id="font-scale-toggle-btn" onclick="appState.cycleFontSize()" 
              class="px-2 py-1 rounded-xl border border-pink-300 hover:bg-pink-50 transition flex items-center gap-1 shadow-sm bg-white shrink-0 cursor-pointer text-slate-700" title="切換字體大小 (標準 / 舒適 / 大字)">
              <span class="text-xs font-black">🔍A</span>
              <span class="text-xs font-bold hidden md:inline">108%</span>
            </button>

            <!-- COTE Silhouette Cut-In Easter Egg Button (Visible in OAA mode) -->
            <button id="cote-summon-easteregg-btn" onclick="appState.triggerSilhouetteCutIn()" 
              class="hidden px-2 sm:px-2.5 py-1 rounded-xl bg-gradient-to-r from-rose-950 via-red-950 to-slate-900 hover:from-rose-900 hover:to-amber-950 text-amber-300 border border-amber-500/50 hover:border-amber-400 text-xs font-black shadow-md items-center gap-1 active:scale-95 shrink-0 transition cursor-pointer" title="實力者降臨 (本格動漫剪影彩蛋)">
              <span class="text-xs">⚡</span>
              <span class="font-serif hidden sm:inline">實力召喚</span>
            </button>

            <!-- Desktop Only Collapse Button -->
            <button onclick="appState.toggleHeader()" 
              class="hidden md:flex p-1.5 rounded-xl border border-pink-300 bg-pink-100 hover:bg-pink-200 text-pink-800 font-bold text-xs transition items-center justify-center shadow-sm shrink-0 active:scale-90 cursor-pointer" title="收合頂部選單">
              <i data-lucide="chevron-up" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

      </div>
    </header>

    <!-- Navigation Tab Bar (Row 2) - Grouped into High-Frequency Teaching & Low-Frequency Setup -->
    <nav id="main-nav-bar" class="glass-card border-b px-2 sm:px-6 overflow-x-auto no-scrollbar">
      <div class="max-w-7xl mx-auto flex items-center space-x-1 sm:space-x-2 py-1">
        
        <!-- Unobtrusive Expand Header Button in Sticky Nav Bar (Visible only when Header is Collapsed) -->
        <button id="header-unhide-pill" onclick="appState.toggleHeader(true)" 
          class="hidden shrink-0 px-2.5 py-1 rounded-xl bg-pink-100/90 hover:bg-pink-200 text-pink-800 font-black text-xs border border-pink-300 transition flex items-center gap-1.5 shadow-sm active:scale-95 whitespace-nowrap cursor-pointer" title="點擊展開頂部選單">
          <span class="kitty-bow !w-3 !h-3"></span>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
          <span>選單</span>
          <span class="text-[9px] px-1 py-0.2 rounded bg-pink-200/80 text-pink-900 font-mono font-bold">v1.9.21</span>
        </button>

        <!-- Core Daily Teaching Group (高頻日常教學核心) -->
        <div class="flex items-center space-x-1 sm:space-x-1.5 shrink-0">
          <!-- 1. 課堂點記板 (Daily Instant Scoring) -->
          <button onclick="appState.switchTab('matrix')" data-tab="matrix" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap">
            <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
            <span>課堂點記板</span>
          </button>

          <!-- 2. 課堂事後補記 (Post-class Retro Scoring) -->
          <button onclick="appState.switchTab('retro')" data-tab="retro" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap">
            <i data-lucide="clock" class="w-3.5 h-3.5"></i>
            <span>⏰ 課堂事後補記</span>
          </button>

          <!-- 3. 學生檔案 & 平時成績 (Student Dossier & Formative Scores) -->
          <button onclick="appState.switchTab('student-dossier')" data-tab="student-dossier" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap">
            <i data-lucide="user-check" class="w-3.5 h-3.5"></i>
            <span>👤 檔案 & 平時成績</span>
          </button>

          <!-- 4. 班級統計戰情室 (Class Analytics) -->
          <button onclick="appState.switchTab('dashboard')" data-tab="dashboard" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap">
            <i data-lucide="pie-chart" class="w-3.5 h-3.5"></i>
            <span>📊 統計戰情室</span>
          </button>

          <!-- 5. AI 成績匯入 (AI Grade Import) -->
          <button onclick="appState.switchTab('ai-hub')" data-tab="ai-hub" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap">
            <i data-lucide="bot" class="w-3.5 h-3.5"></i>
            <span>🤖 AI 成績匯入</span>
          </button>
        </div>

        <!-- Visual Divider separating daily teaching from low-frequency setup/tools -->
        <div class="h-4 w-[1px] bg-slate-300 dark:bg-amber-500/40 mx-1 shrink-0"></div>

        <!-- Low-Frequency Setup & Auxiliary Tools Group (低頻/一次性設定與輔助工具) -->
        <div class="flex items-center space-x-1 shrink-0 opacity-80 hover:opacity-100 transition">
          <span class="text-[10px] font-bold text-slate-400 dark:text-amber-300/60 px-1 hidden xl:inline select-none">設定與輔助：</span>

          <!-- 6. 班級名單 (Roster Management - Low Frequency Setup) -->
          <button onclick="appState.switchTab('roster')" data-tab="roster" class="nav-tab-btn px-2.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 whitespace-nowrap text-slate-600 dark:text-slate-300" title="開學設定：學生名冊與性別管理">
            <i data-lucide="user-plus" class="w-3.5 h-3.5"></i>
            <span>👥 班級名單</span>
          </button>

          <!-- 7. 課表排程 (Timetable Schedule - Low Frequency Setup) -->
          <button onclick="appState.switchTab('timetable')" data-tab="timetable" class="nav-tab-btn px-2.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 whitespace-nowrap text-slate-600 dark:text-slate-300" title="課表時間與節次對應設定">
            <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
            <span>📅 課表排程</span>
          </button>

          <!-- 8. 學生記事檢索 (Student Events Search) -->
          <button onclick="appState.switchTab('events')" data-tab="events" class="nav-tab-btn px-2.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 whitespace-nowrap text-slate-600 dark:text-slate-300" title="歷史加扣分與日常記事查詢">
            <i data-lucide="book-open" class="w-3.5 h-3.5"></i>
            <span>🔍 記事檢索</span>
          </button>

          <!-- 9. 師生互動板 (Feedback Board) -->
          <button onclick="appState.switchTab('feedback-board')" data-tab="feedback-board" class="nav-tab-btn px-2.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 whitespace-nowrap text-slate-600 dark:text-slate-300" title="班級公告與師生留言互動">
            <i data-lucide="message-circle" class="w-3.5 h-3.5"></i>
            <span>💬 師生互動板</span>
          </button>

          <!-- 10. 圖文說明書 (User Guide) -->
          <button onclick="appState.switchTab('guide')" data-tab="guide" class="nav-tab-btn px-2.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 whitespace-nowrap text-slate-600 dark:text-slate-300" title="操作圖文說明手冊">
            <i data-lucide="help-circle" class="w-3.5 h-3.5"></i>
            <span>📖 說明書</span>
          </button>

          <!-- 11. 公佈欄 & 更新日誌 (Changelog Modal) -->
          <button onclick="appState.openBulletinModal()" class="nav-tab-btn px-2.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 whitespace-nowrap shadow-sm text-slate-600 dark:text-slate-300" title="版本更新記錄與功能公告">
            <i data-lucide="bell" class="w-3.5 h-3.5"></i>
            <span>📢 公佈欄</span>
          </button>
        </div>
      </div>
    </nav>
  </div>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-2.5 sm:p-6">
    <!-- Tab 1: Classroom Matrix View -->
    <section id="classroom-matrix-view" class="tab-panel animate-fade-in-up"></section>

    <!-- Tab 2: Class & Student Roster Manager View -->
    <section id="roster-manager-view" class="tab-panel hidden animate-fade-in-up"></section>

    <!-- Tab 3: Dedicated Post-Class Retro-Logging View -->
    <section id="retro-log-view" class="tab-panel hidden animate-fade-in-up"></section>

    <!-- Tab 4: Class Dashboard View -->
    <section id="dashboard-view" class="tab-panel hidden animate-fade-in-up"></section>

    <!-- Tab 5: Timetable View -->
    <section id="timetable-editor-view" class="tab-panel hidden animate-fade-in-up"></section>

    <!-- Tab 6: Events Log & Narrative Notes View -->
    <section id="events-log-view" class="tab-panel hidden animate-fade-in-up"></section>

    <!-- Tab 7: Student Dossier View -->
    <section id="student-dossier-view" class="tab-panel hidden animate-fade-in-up"></section>

    <!-- Tab 8: AI Hub & Schema View -->
    <section id="ai-hub-view" class="tab-panel hidden animate-fade-in-up"></section>

    <!-- Tab 9: Feedback & Interactive Community Board View -->
    <section id="feedback-board-view" class="tab-panel hidden animate-fade-in-up"></section>

    <!-- Tab 10: Visual User Guide View -->
    <section id="user-guide-view" class="tab-panel hidden animate-fade-in-up"></section>
  </main>

  <!-- Floating Quick Guide Button on Bottom-Left (Hidden on small mobile) -->
  <button onclick="appState.switchTab('guide')" class="hidden sm:flex floating-guide-btn px-4 py-2.5 rounded-2xl bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-white font-bold text-xs shadow-xl transition items-center gap-2">
    <span class="kitty-bow"></span>
    <span>💡 點我看圖文說明書</span>
  </button>

  <!-- Global Footer -->
  <footer class="hidden sm:flex glass-card border-t py-3.5 px-6 text-center text-xs opacity-85 items-center justify-between">
    <div class="flex items-center space-x-2">
      <span class="kitty-cat-mini"></span>
      <span class="font-black text-pink-600">ClassQuant Hub v1.3.0</span>
      <span class="text-slate-500">| 三麗鷗家族陪伴國中教師因材施教</span>
    </div>
    <div class="flex items-center space-x-2">
      <button onclick="appState.checkForUpdates(false)" class="text-pink-600 hover:underline font-bold flex items-center gap-1">
        <i data-lucide="refresh-cw" class="w-3 h-3"></i> 檢查更新
      </button>
      <span class="text-slate-300">•</span>
      <span class="text-slate-500">已部署至 GitHub Pages</span>
    </div>
  </footer>

  <!-- Global Modal Container -->
  <div id="global-modal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="glass-card rounded-3xl w-full max-w-lg overflow-hidden border border-pink-300 shadow-2xl relative bg-white" id="global-modal-content">
      <!-- Injected via JavaScript -->
    </div>
  </div>

  <!-- Global Toast Container -->
  <div id="global-toast" class="fixed bottom-6 right-6 z-50 px-4 py-2.5 rounded-2xl border text-xs font-bold shadow-2xl flex items-center gap-2 transition-all transform duration-300 translate-y-20 opacity-0 pointer-events-none"></div>

  <!-- 《實力至上主義教室》S-SYSTEM 內部終端彩蛋視窗 -->
  <div id="cote-terminal-modal" class="hidden">
    <div class="cote-terminal-card p-5 sm:p-6 space-y-4">
      <!-- Modal Header -->
      <div class="flex items-center justify-between border-b border-amber-500/40 pb-3">
        <div class="flex items-center space-x-2">
          <span class="text-lg">🏛️</span>
          <div>
            <div class="text-[10px] sm:text-xs font-black tracking-widest text-amber-400 uppercase">ADVANCED NURTURING HIGH SCHOOL</div>
            <div class="text-xs text-rose-300 font-mono font-bold">S-SYSTEM // 內部機密終端</div>
          </div>
        </div>
        <button onclick="appState.closeCoteEasterEgg()" class="w-8 h-8 rounded-full bg-rose-950/80 hover:bg-rose-900 border border-amber-500/50 text-amber-200 flex items-center justify-center font-black transition active:scale-90 cursor-pointer" title="關閉終端">
          ✕
        </button>
      </div>

      <!-- Ayanokouji Kiyotaka Speaker Header -->
      <div class="flex items-center space-x-3.5 bg-black/40 p-3 rounded-2xl border border-amber-500/30">
        <img src="./assets/cote/ic-1-1.jpg" alt="綾小路 清隆" class="w-12 h-12 rounded-xl border-2 border-amber-400 shadow-md object-cover shrink-0">
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between">
            <h3 class="text-sm sm:text-base font-black text-white tracking-wide">綾小路 清隆</h3>
            <span class="oaa-rank-badge oaa-rank-S px-2 py-0.5 text-[10px]">OAA: S+</span>
          </div>
          <p class="text-[11px] text-amber-200/80 font-mono">D CLASS // 學生編號 S01T004721</p>
        </div>
      </div>

      <!-- Terminal Quote Content Body -->
      <div class="bg-[#12050c]/90 rounded-2xl p-4 border border-rose-950/80 space-y-2.5 min-h-[115px] flex flex-col justify-center">
        <div class="flex items-center justify-between text-[10px] text-amber-400/80 font-mono border-b border-white/10 pb-1">
          <span id="cote-quote-source">【第1季 最終話結尾白室獨白】</span>
          <span id="cote-quote-index">語錄 1/8</span>
