/* === js/tagManager.js === */
/**
 * Tag Management Module
 * Allows teacher to add custom tags, edit point values, delete unwanted tags, and restore defaults.
 * 1:1 Direct Finger-Locked Drag Engine (0ms Latency, 120Hz Real-Time Tracking, Fluid Bubble Parting).
 */

class TagManager {
  constructor(store) {
    this.store = store;
    this.currentClassId = null;
    this.isDragging = false;
    this.draggedTagId = null;
    this.draggedIndex = null;
    this.targetIndex = null;
    this.startTouchY = 0;
    this.startTouchX = 0;
    this.cardSnapshots = [];
    this.stepHeight = 56;
    this.ghostEl = null;
    this.longPressTimer = null;
    this.lastModalScrollTop = 0;
    this.scrollEl = null;
  }

  openTagManagerModal() {
    this.currentClassId = window.appState?.currentClassId || '801';
    this.lastModalScrollTop = 0;
    const modal = document.getElementById('global-modal');
    const modalContent = document.getElementById('global-modal-content');
    if (!modal || !modalContent) return;

    this.renderModalContent(modalContent);
    modal.classList.remove('hidden');
    if (window.lucide) window.lucide.createIcons();
  }

  renderModalContent(container) {
    this.currentClassId = window.appState?.currentClassId || '801';
    const scrollEl = document.getElementById('tag-manager-modal-scroll');
    const savedScrollTop = scrollEl ? scrollEl.scrollTop : (this.lastModalScrollTop || 0);

    const tags = this.store.getTags(this.currentClassId);
    const cls = this.store.getClass(this.currentClassId);
    const className = cls ? cls.name : `${this.currentClassId} 班`;
    const isHomeroom = cls ? cls.type === 'homeroom' : this.currentClassId === '801';

    container.innerHTML = `
      <div class="flex flex-col max-h-[85vh] bg-white rounded-3xl overflow-hidden shadow-2xl border-2 border-pink-300">
        <!-- Sticky Fixed Header at top with permanently visible X -->
        <div class="px-5 py-3.5 bg-gradient-to-r from-pink-50 via-white to-pink-50 border-b border-pink-200 flex items-center justify-between flex-shrink-0 z-30">
          <div class="flex items-center space-x-2.5">
            <div class="sanrio-kitty-badge !w-9 !h-9"></div>
            <div>
              <h3 class="text-base sm:text-lg font-black text-slate-900 flex items-center gap-1.5">
                ${isHomeroom ? '【導師班】快速標籤管理' : '【任教班/數學班】快速標籤管理'}
                <span class="kitty-bow !w-3.5 !h-3.5"></span>
              </h3>
              <p class="text-[11px] text-pink-700 font-bold">
                ${isHomeroom ? '【801 導師班專屬】標籤庫 • 長按拖曳氣泡擠開排序' : `【${className} 等全體任教班共用】標籤庫 • 長按拖曳排序`}
              </p>
            </div>
          </div>
          <!-- Permanently pinned close X button that never scrolls away -->
          <button onclick="window.appState.closeModal()" class="w-8 h-8 rounded-full bg-white hover:bg-pink-100 text-pink-700 font-black text-base flex items-center justify-center transition active:scale-95 shadow border border-pink-200 cursor-pointer" title="關閉標籤管理">
            ✕
          </button>
        </div>

        <!-- Scrollable Single Body -->
        <div id="tag-manager-modal-scroll" class="p-5 overflow-y-auto flex-1 space-y-4">
          <!-- Add New Tag Form Accordion -->
          <div class="glass-card rounded-2xl p-4 border border-pink-300 bg-pink-50/50">
            <h4 class="text-xs font-black text-pink-800 mb-3 flex items-center gap-1.5">
              <i data-lucide="plus-circle" class="w-4 h-4"></i> 為【${isHomeroom ? '導師班' : '任教班/數學班'}】新增自訂表現標籤
            </h4>
            <form onsubmit="tagManager.handleCreateTag(event)" class="space-y-3">
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">標籤名稱</label>
                  <input type="text" id="new-tag-name" required placeholder="例：作業字跡特優" class="w-full bg-white border border-pink-300 rounded-xl px-2.5 py-1.5 text-xs text-slate-900 font-bold focus:outline-none focus:border-pink-500">
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">積分變動 (+/- 分)</label>
                  <input type="number" id="new-tag-delta" required value="2" min="-20" max="20" class="w-full bg-white border border-pink-300 rounded-xl px-2.5 py-1.5 text-xs text-slate-900 font-bold focus:outline-none focus:border-pink-500">
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">所屬類別</label>
                  <select id="new-tag-category" class="w-full bg-white border border-pink-300 rounded-xl px-2.5 py-1.5 text-xs text-slate-900 font-bold focus:outline-none focus:border-pink-500">
                    <option value="academic">數學學業 (解題/作業)</option>
                    <option value="discipline" selected>生活常規 (遲到/紀律)</option>
                    <option value="conflict">同儕人際/衝突</option>
                    <option value="social">熱心助人/責任感</option>
                  </select>
                </div>
              </div>

              <div class="flex items-center justify-between pt-1">
                <span class="text-[10px] text-slate-500">分值設為 0 可作為純日常記事標籤</span>
                <button type="submit" class="px-4 py-2 bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-white rounded-xl text-xs font-black shadow-md transition flex items-center gap-1">
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i> 新增此標籤
                </button>
              </div>
            </form>
          </div>

          <!-- Current Tags List -->
          <div>
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div>
                <h4 class="text-xs font-black text-slate-700 uppercase tracking-wider">【${isHomeroom ? '導師班' : '任教班/數學班'}】現有標籤 (${tags.length} 個)</h4>
                <span class="text-[10px] text-pink-600 font-bold">💡 排在前 4 個的標籤，會優先顯示在點記板第 1 頁</span>
              </div>
              <div class="flex items-center space-x-2">
                <select onchange="tagManager.handleSortModeChange(this.value)" class="text-xs font-black px-2.5 py-1 rounded-xl border border-pink-300 bg-pink-50 text-pink-900 focus:outline-none">
                  <option value="custom" ${this.store.getTagSortMode(this.currentClassId) === 'custom' ? 'selected' : ''}>📌 依此清單自訂順序</option>
                  <option value="frequency" ${this.store.getTagSortMode(this.currentClassId) === 'frequency' ? 'selected' : ''}>📊 依班級使用頻率</option>
                </select>
                ${!isHomeroom ? `
                  <button onclick="tagManager.copyHomeroomTags()" class="text-xs text-slate-400 hover:text-pink-600 hover:underline font-bold transition flex items-center gap-0.5" title="將導師班標籤複製一份覆蓋至任教班">
                    📥 複製導師班標籤
                  </button>
                ` : ''}
                <button onclick="tagManager.restoreDefaults()" class="text-xs text-slate-400 hover:text-pink-600 hover:underline font-bold transition">
                  恢復預設
                </button>
              </div>
            </div>

            <div class="space-y-2 pr-1" id="tag-manager-drag-list">
              ${tags.map((tag, idx) => {
                const isPos = tag.delta > 0;
                const isZero = tag.delta === 0;
                const badgeClass = isPos ? 'color-rule-pos-badge' : isZero ? 'color-rule-zero-badge' : 'color-rule-neg-badge';
                const isTop4 = idx < 4;

                return `
                  <div id="tag-item-${tag.id}"
                       data-tag-id="${tag.id}"
                       class="tag-sort-card flex items-center justify-between p-2.5 rounded-xl bg-white border ${isTop4 ? 'border-pink-300 shadow-sm ring-1 ring-pink-200' : 'border-pink-100'} hover:border-pink-300 text-xs select-none cursor-grab active:cursor-grabbing"
                       ontouchstart="tagManager.handleCardPointerDown(event, '${tag.id}')"
                       onmousedown="tagManager.handleCardPointerDown(event, '${tag.id}')">
                    <div class="flex items-center space-x-2.5 pointer-events-none">
                      <!-- Order Badge & Up/Down Buttons -->
                      <div class="flex items-center space-x-1 pointer-events-auto">
                        <span class="w-6 h-6 rounded-lg ${isTop4 ? 'bg-pink-500 text-white' : 'bg-slate-100 text-slate-700'} font-black text-[10px] flex items-center justify-center shadow-inner" title="${isTop4 ? '第 1 頁優先顯示' : `第 ${Math.floor(idx / 4) + 1} 頁`}">
                          #${idx + 1}
                        </span>
                        <div class="flex flex-col space-y-0.5">
                          <button type="button" onclick="tagManager.moveTagUp('${tag.id}')" ${idx === 0 ? 'disabled class="opacity-20 cursor-not-allowed"' : 'class="hover:bg-pink-100 rounded px-1 text-slate-700 font-black text-[9px] active:scale-90"'} title="往上移一格">
                            ▲
                          </button>
                          <button type="button" onclick="tagManager.moveTagDown('${tag.id}')" ${idx === tags.length - 1 ? 'disabled class="opacity-20 cursor-not-allowed"' : 'class="hover:bg-pink-100 rounded px-1 text-slate-700 font-black text-[9px] active:scale-90"'} title="往下移一格">
                            ▼
                          </button>
                        </div>
                      </div>

                      <span class="font-black px-2.5 py-0.5 rounded-lg text-xs border ${badgeClass}">
                        ${tag.delta > 0 ? '+' : ''}${tag.delta} 分
                      </span>
                      <div>
                        <div class="flex items-center gap-1">
                          <strong class="text-slate-900 font-black text-sm">${tag.name}</strong>
                          ${isTop4 ? '<span class="text-[9px] px-1.5 py-0.2 rounded bg-amber-100 text-amber-800 font-bold border border-amber-300">⭐ 第1頁</span>' : ''}
                        </div>
                        <span class="text-[10px] text-slate-500">(${tag.category === 'academic' ? '學業' : tag.category === 'conflict' ? '衝突' : tag.category === 'social' ? '熱心' : '常規'})</span>
                      </div>
                    </div>

                    <div class="flex items-center space-x-1.5 pointer-events-auto">
                      <button onclick="tagManager.editTagDelta('${tag.id}')" class="px-2 py-1 rounded-lg text-slate-600 hover:bg-slate-100 text-[11px] font-bold border transition">
                        改分值
                      </button>
                      <button onclick="tagManager.deleteTag('${tag.id}')" class="p-1 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition" title="刪除此標籤">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

    const newScrollEl = document.getElementById('tag-manager-modal-scroll');
    if (newScrollEl && savedScrollTop) {
      newScrollEl.scrollTop = savedScrollTop;

  }

  // --- 1:1 Direct Finger-Locked Engine Handlers ---
  handleCardPointerDown(e, tagId) {
    if (e.target.closest('button') || e.target.closest('input') || e.target.closest('select')) return;

    const touch = e.touches ? e.touches[0] : e;
    this.startTouchX = touch.clientX;
    this.startTouchY = touch.clientY;

    clearTimeout(this.longPressTimer);

    // Cancel drag immediately if user is scrolling (> 6px movement)
    const cancelIfMoved = (moveEvent) => {
      const t = moveEvent.touches ? moveEvent.touches[0] : moveEvent;
      const dx = Math.abs(t.clientX - this.startTouchX);
      const dy = Math.abs(t.clientY - this.startTouchY);
      if (dx > 6 || dy > 6) {
        clearTimeout(this.longPressTimer);
        this.longPressTimer = null;
        cleanupPreDrag();
      }
    };

    const cancelOnRelease = () => {
      clearTimeout(this.longPressTimer);
      this.longPressTimer = null;
      cleanupPreDrag();
    };

    const cleanupPreDrag = () => {
      window.removeEventListener('touchmove', cancelIfMoved);
      window.removeEventListener('mousemove', cancelIfMoved);
      window.removeEventListener('touchend', cancelOnRelease);
      window.removeEventListener('mouseup', cancelOnRelease);
      window.removeEventListener('touchcancel', cancelOnRelease);
    };

    window.addEventListener('touchmove', cancelIfMoved, { passive: true });
    window.addEventListener('mousemove', cancelIfMoved, { passive: true });
    window.addEventListener('touchend', cancelOnRelease, { passive: true });
    window.addEventListener('mouseup', cancelOnRelease, { passive: true });
    window.addEventListener('touchcancel', cancelOnRelease, { passive: true });

    // Activate drag ONLY if finger stays still for 300ms
    this.longPressTimer = setTimeout(() => {
      cleanupPreDrag();
      this.startDirectDrag(touch, tagId);
    }, 300);
  }

  startDirectDrag(touch, tagId) {
    this.isDragging = true;
    this.draggedTagId = tagId;
    this.scrollEl = document.getElementById('tag-manager-modal-scroll');
    this.startScrollTop = this.scrollEl ? this.scrollEl.scrollTop : 0;

    if (navigator.vibrate) navigator.vibrate([35, 25, 35]);
    if (window.appState?.playPop) window.appState.playPop();

    const listEl = document.getElementById('tag-manager-drag-list');
    const cards = Array.from(listEl.querySelectorAll('.tag-sort-card'));

    // Snapshot static visual centers relative to scroll container top
    this.cardSnapshots = cards.map((card, index) => {
      const rect = card.getBoundingClientRect();
      return {
        id: card.getAttribute('data-tag-id'),
        index,
        top: rect.top,
        bottom: rect.bottom,
        centerY: rect.top + rect.height / 2,
        height: rect.height
      };
    });

    this.draggedIndex = this.cardSnapshots.findIndex(s => s.id === tagId);
    this.targetIndex = this.draggedIndex;

    const sampleCard = cards[0];
    const sampleHeight = sampleCard ? sampleCard.getBoundingClientRect().height : 52;
    this.stepHeight = sampleHeight + 8; // Card height + Tailwind space-y-2 gap

    const originalCard = document.getElementById(`tag-item-${tagId}`);
    if (originalCard) {
      const rect = originalCard.getBoundingClientRect();
      this.initialCardRect = rect;

      // Clone clean ghost
      const ghost = originalCard.cloneNode(true);
      ghost.id = 'ios-drag-floating-ghost';
      ghost.classList.remove('is-dragging-card');
      ghost.classList.add('ios-ghost-card');
      ghost.style.position = 'fixed';
      ghost.style.left = `${rect.left}px`;
      ghost.style.top = `${rect.top}px`;
      ghost.style.width = `${rect.width}px`;
      ghost.style.height = `${rect.height}px`;
      ghost.style.transform = 'translate3d(0, 0, 0) scale(1.05)';
      ghost.style.transition = 'none';
      document.body.appendChild(ghost);
      this.ghostEl = ghost;

      // Mark original card as dragging placeholder slot
      originalCard.classList.add('is-dragging-card');
    }

    // Prevent default touch scrolling during drag
    document.body.style.userSelect = 'none';
    document.body.style.webkitUserSelect = 'none';
    if (this.scrollEl) this.scrollEl.style.touchAction = 'none';

    // Bind 1:1 window listeners for pure 0ms latency tracking
    this.boundMove = (e) => this.handleDirectDragMove(e);
    this.boundEnd = (e) => this.handleDirectDragEnd(e);
    window.addEventListener('touchmove', this.boundMove, { passive: false });
    window.addEventListener('touchend', this.boundEnd);
    window.addEventListener('mousemove', this.boundMove);
    window.addEventListener('mouseup', this.boundEnd);
  }

  handleDirectDragMove(e) {
    const touch = e.touches ? e.touches[0] : e;

    if (this.isDragging) {
      if (e.cancelable) e.preventDefault();

      // 1. ABSOLUTE 1:1 FINGER POSITION (0ms lag, 100% physically glued to finger velocity)
      const dy = touch.clientY - this.startTouchY;
      const dx = (touch.clientX - this.startTouchX) * 0.15; // Subtle organic sway
      if (this.ghostEl) {
        this.ghostEl.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(1.05)`;
      }

      // 2. Auto-scroll with scroll delta synchronization
      const currentScrollTop = this.scrollEl ? this.scrollEl.scrollTop : 0;
      const deltaScroll = currentScrollTop - this.startScrollTop;

      if (this.scrollEl) {
        const modalRect = this.scrollEl.getBoundingClientRect();
        let scrollSpeed = 0;
        if (touch.clientY < modalRect.top + 70) {
          scrollSpeed = -Math.min(14, Math.max(3, (modalRect.top + 70 - touch.clientY) * 0.35));
        } else if (touch.clientY > modalRect.bottom - 70) {
          scrollSpeed = Math.min(14, Math.max(3, (touch.clientY - (modalRect.bottom - 70)) * 0.35));
        }
        if (scrollSpeed !== 0) {
          this.scrollEl.scrollTop += scrollSpeed;
        }
      }

      // 3. Human Intuition Centerline & Gap Midpoint Detection with Scroll Delta Compensation
      const ghostCenterY = this.initialCardRect.top + dy + (this.initialCardRect.height / 2);
      const n = this.cardSnapshots.length;
      let newTargetIdx = n - 1;

      for (let i = 0; i < n - 1; i++) {
        // Adjust snapshot centers for real-time container scroll
        const center_i = this.cardSnapshots[i].centerY - deltaScroll;
        const center_next = this.cardSnapshots[i + 1].centerY - deltaScroll;
        const boundaryY = (center_i + center_next) / 2;

        // Directional hysteresis deadzone: requires crossing past the gap/centerline before flipping slot
        const hysteresis = (this.targetIndex !== null && this.targetIndex > i) ? -6 : 6;
        if (ghostCenterY < boundaryY + hysteresis) {
          newTargetIdx = i;
          break;
        }
      }

      newTargetIdx = Math.max(0, Math.min(n - 1, newTargetIdx));

      if (newTargetIdx !== this.targetIndex) {
        this.targetIndex = newTargetIdx;
        this.updateListDisplacement(this.draggedIndex, newTargetIdx);
        if (navigator.vibrate) navigator.vibrate(15);
      }
    } else if (this.startTouchX && this.startTouchY) {
      const dx = Math.abs(touch.clientX - this.startTouchX);
      const dy = Math.abs(touch.clientY - this.startTouchY);
      if (dx > 6 || dy > 6) {
        clearTimeout(this.longPressTimer);
      }
    }
  }

  updateListDisplacement(fromIdx, toIdx) {
    const tags = this.store.getTags(this.currentClassId);
    const step = this.stepHeight;

    tags.forEach((tag, idx) => {
      const card = document.getElementById(`tag-item-${tag.id}`);
      if (!card) return;

      if (idx === fromIdx) {
        // Placeholder slot glides instantly to new gap position
        const offset = (toIdx - fromIdx) * step;
        card.style.transform = `translate3d(0, ${offset}px, 0)`;
      } else {
        let offset = 0;
        if (fromIdx < toIdx && idx > fromIdx && idx <= toIdx) {
          // Sliding upward like an air bubble being pushed up
          offset = -step;
        } else if (fromIdx > toIdx && idx >= toIdx && idx < fromIdx) {
          // Sliding downward like an air bubble being squeezed down
          offset = step;
        }
        card.style.transform = offset !== 0 ? `translate3d(0, ${offset}px, 0)` : '';
      }
    });
  }

  copyHomeroomTags() {
    if (confirm('確定要將【導師班】的所有自訂標籤與排序，完整複製並覆蓋至【任教班/數學班】嗎？\n（此操作將會取代任教班目前的標籤清單與自訂順序）')) {
      this.store.copyHomeroomTagsToSubject();
      if (window.appState?.playChime) window.appState.playChime();
      if (navigator.vibrate) navigator.vibrate([30, 20, 30]);
      window.appState.showToast('✨ 已成功將【導師班】標籤庫複製覆蓋至【任教班】！', 'success');
      this.refreshModalPreservingScroll();
    }
  }

  handleDirectDragEnd(e) {
    clearTimeout(this.longPressTimer);

    if (this.isDragging) {
      const fromIdx = this.draggedIndex;
      const toIdx = this.targetIndex;

      if (toIdx !== null && toIdx !== fromIdx && fromIdx >= 0 && toIdx >= 0) {
        this.store.reorderTagsByIndex(fromIdx, toIdx, this.currentClassId);
        if (window.appState?.playChime) window.appState.playChime();
        if (navigator.vibrate) navigator.vibrate([30, 20, 30]);
        window.appState.showToast('✨ 標籤已像水漾氣泡般平滑塞入！', 'success');
      }

      this.stopDirectDrag();
    }
  }

  stopDirectDrag() {
    this.isDragging = false;

    // Remove window listeners
    if (this.boundMove) {
      window.removeEventListener('touchmove', this.boundMove);
      window.removeEventListener('mousemove', this.boundMove);
      this.boundMove = null;
    }
    if (this.boundEnd) {
      window.removeEventListener('touchend', this.boundEnd);
      window.removeEventListener('mouseup', this.boundEnd);
      this.boundEnd = null;
    }

    document.body.style.userSelect = '';
    document.body.style.webkitUserSelect = '';
    if (this.scrollEl) this.scrollEl.style.touchAction = '';

    if (this.ghostEl) {
      this.ghostEl.remove();
      this.ghostEl = null;
    }

    const tags = this.store.getTags(this.currentClassId);
    tags.forEach(tag => {
      const card = document.getElementById(`tag-item-${tag.id}`);
      if (card) {
        card.style.transform = '';
        card.classList.remove('is-dragging-card');
      }
    });

    const scrollEl = document.getElementById('tag-manager-modal-scroll');
    this.lastModalScrollTop = scrollEl ? scrollEl.scrollTop : 0;
    const modalContent = document.getElementById('global-modal-content');
    if (modalContent) this.renderModalContent(modalContent);
    if (window.matrixView) window.matrixView.render('classroom-matrix-view', window.appState.currentClassId);
  }

  handleSortModeChange(mode) {
    this.currentClassId = window.appState?.currentClassId || '801';
    this.store.setTagSortMode(mode, this.currentClassId);
    window.appState.showToast(`標籤排序已切換為：「${mode === 'custom' ? '📌 依自訂清單順序' : '📊 依班級使用頻率'}」`, 'info');
    if (window.matrixView) window.matrixView.render('classroom-matrix-view', this.currentClassId);
  }

  moveTagUp(tagId) {
    this.currentClassId = window.appState?.currentClassId || '801';
    const scrollEl = document.getElementById('tag-manager-modal-scroll');
    this.lastModalScrollTop = scrollEl ? scrollEl.scrollTop : 0;
    const success = this.store.moveTag(tagId, 'up', this.currentClassId);
    if (success) {
      if (window.appState?.playPop) window.appState.playPop();
      const modalContent = document.getElementById('global-modal-content');
      if (modalContent) this.renderModalContent(modalContent);
      if (window.matrixView) window.matrixView.render('classroom-matrix-view', this.currentClassId);
    }
  }

  moveTagDown(tagId) {
    this.currentClassId = window.appState?.currentClassId || '801';
    const scrollEl = document.getElementById('tag-manager-modal-scroll');
    this.lastModalScrollTop = scrollEl ? scrollEl.scrollTop : 0;
    const success = this.store.moveTag(tagId, 'down', this.currentClassId);
    if (success) {
      if (window.appState?.playPop) window.appState.playPop();
      const modalContent = document.getElementById('global-modal-content');
      if (modalContent) this.renderModalContent(modalContent);
      if (window.matrixView) window.matrixView.render('classroom-matrix-view', this.currentClassId);
    }
  }

  handleCreateTag(e) {
    e.preventDefault();
    this.currentClassId = window.appState?.currentClassId || '801';
    const name = document.getElementById('new-tag-name').value.trim();
    const delta = parseInt(document.getElementById('new-tag-delta').value, 10) || 0;
    const category = document.getElementById('new-tag-category').value;

    const newTag = {
      id: `custom_tag_${Date.now()}`,
      name,
      delta,
      category,
      severity: delta > 0 ? 'positive' : delta < 0 ? 'warning' : 'info'
    };

    this.store.addTag(newTag, this.currentClassId);
    window.appState.showToast(`已成功新增標籤：「${name} (${delta > 0 ? '+' : ''}${delta})」`, 'success');
    this.refreshModalPreservingScroll();
  }

  editTagDelta(tagId) {
    this.currentClassId = window.appState?.currentClassId || '801';
    const tag = this.store.getTags(this.currentClassId).find(t => t.id === tagId);
    if (!tag) return;

    const newDeltaStr = prompt(`請輸入「${tag.name}」的新分值 (+/-整數)：`, tag.delta);
    if (newDeltaStr !== null) {
      const newDelta = parseInt(newDeltaStr, 10);
      if (!isNaN(newDelta)) {
        tag.delta = newDelta;
        this.store.updateTag(tag.id, tag, this.currentClassId);
        window.appState.showToast(`已將「${tag.name}」分值更新為 ${newDelta > 0 ? '+' : ''}${newDelta}`, 'success');
        this.refreshModalPreservingScroll();
      }
    }
  }

  deleteTag(tagId) {
    this.currentClassId = window.appState?.currentClassId || '801';
    const tag = this.store.getTags(this.currentClassId).find(t => t.id === tagId);
    if (!tag) return;

    if (confirm(`確定要刪除「${tag.name}」標籤嗎？`)) {
      this.store.deleteTag(tagId, this.currentClassId);
      window.appState.showToast(`已刪除「${tag.name}」標籤`, 'info');
      this.refreshModalPreservingScroll();
    }
  }

  restoreDefaults() {
    this.currentClassId = window.appState?.currentClassId || '801';
    if (confirm('確定要恢復為官方預設標籤清單嗎？（自訂標籤將被重設）')) {
      this.store.resetTagsToDefault(this.currentClassId);
      window.appState.showToast('已成功恢復官方預設標籤！', 'success');
      this.refreshModalPreservingScroll();
    }
  }

  refreshModalPreservingScroll() {
    const scrollEl = document.getElementById('tag-manager-modal-scroll');
    if (scrollEl) {
      this.lastModalScrollTop = scrollEl.scrollTop;
    }
    const modalContent = document.getElementById('global-modal-content');
    if (modalContent) {
      this.renderModalContent(modalContent);
    } else {
      this.openTagManagerModal();
    }
    if (window.matrixView) window.matrixView.render('classroom-matrix-view', this.currentClassId);
  }
}

  handleSeatTouchStart(e, seatNo, classId) {

    // 3. Snapshot layout & slots
    const layout = this.store.getSeatingLayout(classId);
    const seatOrder = [...layout.seatOrder];
    this.seatOrderSnapshot = seatOrder;
    this.draggedIndex = seatOrder.indexOf(Number(seatNo));
    this.targetIndex = this.draggedIndex;
    this.currentHoverSeatNo = seatNo;

    // Snapshot exact positions of each slot on screen
    this.slotSnapshots = seatOrder.map((sNo, idx) => {
      const card = document.getElementById(`seat-card-${sNo}`);
      if (!card) return null;
      const r = card.getBoundingClientRect();
      return {
        index: idx,
        seatNo: sNo,
        left: r.left,
        top: r.top,
        width: r.width,
        height: r.height,
        centerX: r.left + r.width / 2,
        centerY: r.top + r.height / 2
      };
    }).filter(Boolean);

    // Lock touch action & selection during drag
    document.body.style.userSelect = 'none';
    document.body.style.webkitUserSelect = 'none';

    // 4. Bind window listeners for 1:1 hardware touch tracking
    this.boundSeatMove = (e) => this.handleSeatDirectMove(e, classId);
    this.boundSeatEnd = (e) => this.handleSeatDirectEnd(e, classId);
    window.addEventListener('touchmove', this.boundSeatMove, { passive: false });
    window.addEventListener('touchend', this.boundSeatEnd);
    window.addEventListener('mousemove', this.boundSeatMove);
    window.addEventListener('mouseup', this.boundSeatEnd);

    const doneBanner = document.getElementById('ios-jiggle-done-bar');
    if (doneBanner) doneBanner.classList.remove('hidden');
  }

  handleSeatDirectMove(e, classId) {
    if (!this.isDragging) return;
    if (e.cancelable) e.preventDefault();

    const touch = e.touches ? e.touches[0] : e;
    const currentScrollY = window.scrollY;
    const deltaScroll = currentScrollY - this.startWindowScrollY;

    // 1. 1:1 hardware direct tracking for ghost
    const dx = touch.clientX - this.startTouchX;
    const dy = touch.clientY - this.startTouchY;
    const vx = touch.clientX - (this.lastTouchX || touch.clientX);
    this.lastTouchX = touch.clientX;
    const tilt = Math.max(-6, Math.min(6, vx * 0.35));

    if (this.dragGhost) {
      this.dragGhost.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(1.08) rotate(${tilt}deg)`;
    }

    // 2. Edge auto-scrolling
    const viewportHeight = window.innerHeight;
    const edgeZone = 75;
    if (touch.clientY < edgeZone) {
      const speed = Math.max(4, Math.round((edgeZone - touch.clientY) / 4));
      window.scrollBy(0, -speed);
    } else if (touch.clientY > viewportHeight - edgeZone) {
      const speed = Math.max(4, Math.round((touch.clientY - (viewportHeight - edgeZone)) / 4));
      window.scrollBy(0, speed);
    }

    // 3. Find closest slot based on center distance
    if (this.slotSnapshots && this.slotSnapshots.length > 0) {
      let closestSlot = null;
      let minDistSq = Infinity;

      for (let slot of this.slotSnapshots) {
        const centerY = slot.centerY - deltaScroll;
        const centerX = slot.centerX;
        const distSq = Math.pow(touch.clientX - centerX, 2) + Math.pow(touch.clientY - centerY, 2);
        if (distSq < minDistSq) {
          minDistSq = distSq;
          closestSlot = slot;
        }
      }

      if (closestSlot && closestSlot.index !== this.targetIndex) {
        const slotRadius = Math.min(closestSlot.width, closestSlot.height) / 2 + 10;
        if (minDistSq < slotRadius * slotRadius * 2.2) {
          this.targetIndex = closestSlot.index;
          this.currentHoverSeatNo = this.seatOrderSnapshot[this.targetIndex];
          this.updateSeatDisplacement(this.draggedIndex, this.targetIndex, classId);
          if (navigator.vibrate) navigator.vibrate(15);
        }
      }
    }
  }

  updateSeatDisplacement(fromIdx, toIdx, classId) {
    if (!this.slotSnapshots || this.slotSnapshots.length === 0) return;

    const seatOrder = this.seatOrderSnapshot;
    const projected = [...seatOrder];
    const [moved] = projected.splice(fromIdx, 1);
    projected.splice(toIdx, 0, moved);

    seatOrder.forEach(seatNo => {
      const card = document.getElementById(`seat-card-${seatNo}`);
      if (!card) return;

      const origIdx = seatOrder.indexOf(seatNo);
      const newIdx = projected.indexOf(seatNo);

      if (seatNo === this.draggedSeatNo) {
        // Dragged source card slot dynamically moves to target slot
        const origSlot = this.slotSnapshots[fromIdx];
        const targetSlot = this.slotSnapshots[toIdx];
        if (origSlot && targetSlot) {
          const dx = targetSlot.left - origSlot.left;
          const dy = targetSlot.top - origSlot.top;
          card.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(0.96)`;
          card.style.transition = 'transform 0.22s cubic-bezier(0.2, 0, 0, 1)';
          card.classList.add('seating-drop-slot');
        }
      } else {
        const origSlot = this.slotSnapshots[origIdx];
        const targetSlot = this.slotSnapshots[newIdx];

        if (newIdx !== origIdx && origSlot && targetSlot) {
          const dx = targetSlot.left - origSlot.left;
          const dy = targetSlot.top - origSlot.top;
          card.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(0.96)`;
          card.style.transition = 'transform 0.22s cubic-bezier(0.2, 0, 0, 1)';
        } else {
          card.style.transform = '';
          card.style.transition = 'transform 0.22s cubic-bezier(0.2, 0, 0, 1)';
        }
      }
    });
  }

  handleSeatDirectEnd(e, classId) {
    clearTimeout(this.longPressTimer);

    if (this.isDragging) {
      this.justFinishedDrag = true;
      setTimeout(() => { this.justFinishedDrag = false; }, 320);

      const fromIdx = this.draggedIndex;
      const toIdx = this.targetIndex;

      if (toIdx !== null && toIdx !== fromIdx && fromIdx >= 0 && toIdx >= 0) {
        const sourceSeat = this.draggedSeatNo;
        const targetSeat = this.seatOrderSnapshot[toIdx];
        this.store.reorderStudentSeats(classId, sourceSeat, targetSeat);
        if (window.appState?.playChime) window.appState.playChime();
        if (navigator.vibrate) navigator.vibrate([30, 20, 30]);

        const students = this.store.getStudents(classId);
        const studentA = students.find(s => s.seatNo === sourceSeat);
        const studentB = students.find(s => s.seatNo === targetSeat);
        window.appState.showToast(`✨ 成功將 ${sourceSeat} 號【${studentA ? studentA.name : ''}】移至 ${studentB ? studentB.name : ''} 前方！`, 'success');
      }

      this.stopIOSDrag(classId);
    }
  }

  stopIOSDrag(classId) {
    this.isDragging = false;
    this.currentHoverSeatNo = null;

    // Remove window listeners cleanly
    if (this.boundSeatMove) {
      window.removeEventListener('touchmove', this.boundSeatMove);
      window.removeEventListener('mousemove', this.boundSeatMove);
      this.boundSeatMove = null;
    }
    if (this.boundSeatEnd) {
      window.removeEventListener('touchend', this.boundSeatEnd);
      window.removeEventListener('mouseup', this.boundSeatEnd);
      this.boundSeatEnd = null;
    }

    document.body.style.userSelect = '';
    document.body.style.webkitUserSelect = '';

    if (this.dragGhost) {
      this.dragGhost.remove();
      this.dragGhost = null;
    }

    // Save exact scroll position
    const currentScrollY = window.pageYOffset || document.documentElement.scrollTop || window.scrollY || 0;
    const currentScrollX = window.pageXOffset || document.documentElement.scrollLeft || window.scrollX || 0;

    this.render('classroom-matrix-view', classId);

    // Restore exact scroll position so screen never jumps to top
    window.scrollTo({
      top: currentScrollY,
      left: currentScrollX,
      behavior: 'instant'
    });
  }

  applyAutoArrange(classId, pattern) {
    const layout = this.store.getSeatingLayout(classId);
    this.store.autoArrangeSeating(classId, pattern, layout.cols || 5);
    if (window.appState?.playChime) window.appState.playChime();
    const patternNames = { normal: '常規直排', snake_s: 'S型蛇行', col_first: '由左至右直排', random: '隨機抽籤' };
    window.appState.showToast(`已套用【${patternNames[pattern] || pattern}】座位排法！`, 'success');
    this.render('classroom-matrix-view', classId);

    this.render('classroom-matrix-view', classId);

  selectGender(gender) {
    const currentClassId = window.appState.currentClassId;
    const students = this.store.getStudents(currentClassId);
    this.selectedSeats.clear();
    const total = students.length;
    students.forEach(s => {
      const studentGender = s.gender || (s.seatNo <= Math.ceil(total / 2) ? 'M' : 'F');
      if (studentGender === gender) {
        this.selectedSeats.add(s.seatNo);
      }
    });
    if (window.appState?.playPop) window.appState.playPop();
    this.updateSelectionUI(currentClassId);
  }

  selectRow(rowIdx) {
    const currentClassId = window.appState.currentClassId;
    const layout = this.store.getSeatingLayout(currentClassId);
    const cols = layout.cols || 5;
    const seatOrder = layout.seatOrder || [];

    this.selectedSeats.clear();
    // rowIdx is 1-based
    const startIdx = (rowIdx - 1) * cols;
    const endIdx = startIdx + cols;
    for (let i = startIdx; i < endIdx && i < seatOrder.length; i++) {
      if (seatOrder[i]) {
        this.selectedSeats.add(seatOrder[i]);
      }
    }

    if (window.appState?.playPop) window.appState.playPop();
    this.updateSelectionUI(currentClassId);
  }

  handleTouchStart(e) {
    if (e.touches && e.touches.length > 0) {
      this.touchStartX = e.touches[0].clientX;
    }
  }

  handleTouchEnd(e) {
    if (e.changedTouches && e.changedTouches.length > 0) {
      const touchEndX = e.changedTouches[0].clientX;
      const diffX = this.touchStartX - touchEndX;

      // Swipe Left (Next Page strictly by 1)
      if (diffX > 45) {
        this.nextTagPage();
      }
      // Swipe Right (Prev Page strictly by 1)
      else if (diffX < -45) {
        this.prevTagPage();
      }
    }
  }

  prevTagPage() {
    if (this.currentTagPage > 0) {
      this.scrollToTagPage(this.currentTagPage - 1);
    }
  }

  nextTagPage() {
    if (this.currentTagPage < (this.maxTagPages || 1) - 1) {
      this.scrollToTagPage(this.currentTagPage + 1);
    }
  }

  scrollToTagPage(pageIdx) {
    this.currentTagPage = pageIdx;
    const box = document.getElementById('tag-pager-scroll-box');
    if (box) {
      box.scrollTo({
        left: box.clientWidth * pageIdx,
        behavior: 'smooth'
      });
    }
    this.updateTagDots(pageIdx);
  }

  handleTagPagerScroll(el) {
    const width = el.clientWidth;
    if (width > 0) {
      const page = Math.round(el.scrollLeft / width);
      if (page !== this.currentTagPage) {
        this.currentTagPage = page;
        this.updateTagDots(page);
      }
    }
  }

  updateTagDots(activeIdx) {
    const dotsContainer = document.getElementById('tag-page-dots');
    if (!dotsContainer) return;
    const dots = dotsContainer.querySelectorAll('button');
    dots.forEach((dot, idx) => {
      if (idx === activeIdx) {
        dot.className = 'w-5 h-2.5 rounded-full bg-pink-600 transition-all';
      } else {
        dot.className = 'w-2.5 h-2.5 rounded-full bg-pink-200 transition-all';
      }
    });
  }

  toggleSeatSelection(seatNo, classId) {
    if (this.selectedSeats.has(seatNo)) {
      this.selectedSeats.delete(seatNo);
    } else {
      this.selectedSeats.add(seatNo);
      if (window.appState?.playPop) window.appState.playPop();
      if (navigator.vibrate) {
        try { navigator.vibrate(15); } catch(e) {}
      }
    }
    this.updateSelectionUI(classId);
  }

  selectAll() {
    const currentClassId = window.appState.currentClassId;
    const students = this.store.getStudents(currentClassId);
    students.forEach(s => this.selectedSeats.add(s.seatNo));
    if (window.appState?.playPop) window.appState.playPop();
    this.updateSelectionUI(currentClassId);
  }

  clearSelection() {
    this.selectedSeats.clear();
    this.updateSelectionUI(window.appState.currentClassId);
  }

  updateSelectionUI(classId) {
    const students = this.store.getStudents(classId);
    students.forEach(s => {
      const card = document.getElementById(`seat-card-${s.seatNo}`);
      if (card) {
        if (this.selectedSeats.has(s.seatNo)) {
          card.classList.add('selected');
        } else {
          card.classList.remove('selected');
        }
      }
    });

    const countElem = document.getElementById('selected-count');
    if (countElem) countElem.innerText = this.selectedSeats.size;

    const clearBtn = document.getElementById('clear-sel-btn');
    if (clearBtn) {
      if (this.selectedSeats.size > 0) {
        clearBtn.classList.remove('hidden');
        clearBtn.classList.add('inline-block');
      } else {
        clearBtn.classList.add('hidden');
        clearBtn.classList.remove('inline-block');
      }
    }
  }

  applyTagToSelected(classId, tagId) {
    if (this.selectedSeats.size === 0) {
      window.appState.showToast('請先點選學生座號（點一下即可）', 'warning');
      return;
    }

    const tag = this.store.getTags(classId).find(t => t.id === tagId);
    if (!tag) return;

    const activeSlot = this.timetable.detectActiveSlot();
    const period = activeSlot.period !== null ? activeSlot.period : 1;

    try {
      let appliedCount = 0;
      const seatsToProcess = Array.from(this.selectedSeats);

      seatsToProcess.forEach(seatNo => {
        this.store.addEvent({
          classId,
          seatNo,
          period,
          tagId: tag.id,
          tagName: tag.name,
          category: tag.category,
          delta: tag.delta,
          severity: tag.severity,
          note: `課堂記點：${tag.name}`
        });

        this.showFloatingBubble(seatNo, tag.delta);
        appliedCount++;

        // In-place score update on card targeting character score span (index 2)
        const card = document.getElementById(`seat-card-${seatNo}`);
        if (card) {
          const profile = this.stats ? this.stats.getStudentProfile(classId, seatNo) : null;
          if (profile) {
            const charPts = profile.pointsBreakdown.discipline + profile.pointsBreakdown.conflict + profile.pointsBreakdown.social;
            const scoreSpans = card.querySelectorAll('div > span');
            if (scoreSpans.length >= 3) {
              const ptsSpan = scoreSpans[2];
              ptsSpan.className = charPts > 0 ? 'text-emerald-700' : charPts < 0 ? 'text-rose-700' : 'text-slate-500';
              ptsSpan.innerText = `${charPts > 0 ? '+' : ''}${charPts}`;
            } else if (scoreSpans.length >= 2) {
              const ptsSpan = scoreSpans[1];
              ptsSpan.className = charPts > 0 ? 'text-emerald-700' : charPts < 0 ? 'text-rose-700' : 'text-slate-500';
              ptsSpan.innerText = `${charPts > 0 ? '+' : ''}${charPts}`;
            }
          }
        }
      });

      // Sound effect
      if (tag.delta > 0 && window.appState?.playChime) {
        window.appState.playChime();
      } else if (tag.delta < 0 && window.appState?.playWarning) {
        window.appState.playWarning();
      }

      window.appState.showToast(`⚡ 已為 ${appliedCount} 位同學記錄「${tag.name} (${tag.delta > 0 ? '+' : ''}${tag.delta})」`, 'success');
    } catch (err) {
      console.error('[ClassroomMatrix] applyTagToSelected error:', err);
    } finally {
      this.clearSelection(classId);
      this.render('classroom-matrix-view', classId);
    }
  }

  showFloatingBubble(seatNo, delta) {
    const card = document.getElementById(`seat-card-${seatNo}`);
    if (!card) return;

    const bubble = document.createElement('div');
    bubble.className = `point-bubble ${delta > 0 ? 'text-emerald-600' : 'text-rose-600'} kitty-stamp-effect`;
    bubble.innerText = `${delta > 0 ? '✨ +' : ''}${delta}`;
    card.appendChild(bubble);

    setTimeout(() => {
      bubble.remove();
    }, 800);
  }

  saveRetroLog(e, classId) {
    e.preventDefault();
    const checkboxes = document.querySelectorAll('input[name="retro_seats"]:checked');
    const seats = Array.from(checkboxes).map(cb => parseInt(cb.value, 10));

    if (seats.length === 0) {
      window.appState.showToast('請至少勾選一位學生', 'warning');
      return;
    }

    const date = document.getElementById('retro-date').value;
    const period = document.getElementById('retro-period').value;
    const note = document.getElementById('retro-note').value.trim();
    const tagSelect = document.getElementById('retro-tag');
    const selectedOpt = tagSelect.options[tagSelect.selectedIndex];
    
    const tagName = selectedOpt.getAttribute('data-name');
    const delta = parseInt(selectedOpt.getAttribute('data-delta'), 10) || 0;
    const category = selectedOpt.getAttribute('data-category') || 'discipline';
    const severity = selectedOpt.getAttribute('data-severity') || 'info';

    seats.forEach(seatNo => {
      this.store.addEvent({
        classId,
        seatNo,
        date,
        period,
        tagId: tagSelect.value,
        tagName,
        category,
        delta,
        severity,
        note: note ? `[事後補記] ${note}` : `[事後補記] ${tagName}`
      });
    });

    if (delta > 0 && window.appState?.playChime) {
      window.appState.playChime();
    } else if (delta < 0 && window.appState?.playWarning) {
      window.appState.playWarning();

    window.appState.showToast(`🎉 已成功補記 ${seats.length} 位同學在 ${date} 第 ${period} 節之記錄！`, 'success');

  runPickerAnimation(classId) {
    const students = this.store.getStudents(classId);
    const box = document.getElementById('picker-result-box');
    const startBtn = document.getElementById('btn-start-pick');
    if (!box || !startBtn) return;

    startBtn.disabled = true;
    startBtn.classList.add('opacity-50', 'cursor-not-allowed');

    let count = 0;
    const maxSteps = 18;
    const interval = setInterval(() => {
      const randIdx = Math.floor(Math.random() * students.length);
      const tempStudent = students[randIdx];
      box.innerHTML = `
        <div class="text-3xl font-black text-pink-600 animate-pulse">${String(tempStudent.seatNo).padStart(2, '0')} 號</div>
        <div class="text-lg font-black mt-1 text-slate-800">${tempStudent.name}</div>
      `;
      count++;

      if (count >= maxSteps) {
        clearInterval(interval);
        startBtn.disabled = false;
        startBtn.classList.remove('opacity-50', 'cursor-not-allowed');

        const chosenStudent = students[Math.floor(Math.random() * students.length)];
        box.innerHTML = `
          <div class="text-4xl font-black text-pink-600 drop-shadow-sm">🌟 ${String(chosenStudent.seatNo).padStart(2, '0')} 號</div>

          </div>
        `;

  }

  saveConflictEvent(e, classId) {
    e.preventDefault();
    const checkboxes = document.querySelectorAll('input[name="involved_seats"]:checked');
    const seats = Array.from(checkboxes).map(cb => parseInt(cb.value, 10));

    if (seats.length === 0) {
      window.appState.showToast('請至少勾選一位學生', 'warning');
      return;
    }

    const type = document.getElementById('conflict-type').value;
    const period = document.getElementById('conflict-period').value;
    const notes = document.getElementById('conflict-notes').value.trim();

    const tag = this.store.getTags(classId).find(t => t.id === type) || {
      id: type,
      name: '重大衝突違紀',
      category: 'conflict',
      delta: -5,
      severity: 'critical'
    };

    seats.forEach(seatNo => {
      this.store.addEvent({
        classId,
        seatNo,
        period,
        tagId: tag.id,
        tagName: tag.name,
        category: 'conflict',
        delta: tag.delta,
        severity: 'critical',
        note: `[重大事件] ${notes} (涉案座號: ${seats.join(', ')})`
      });
      this.showFloatingBubble(seatNo, tag.delta);
    });

    if (window.appState?.playWarning) window.appState.playWarning();

    window.appState.showToast(`已確實記錄座號 ${seats.join(', ')} 重大事件`, 'success');
    window.appState.closeModal();
    this.render('classroom-matrix-view', classId);
  }

  getCoteCharName(index) {
    if (window.appState?.getCoteCharacterByRank) {
      return window.appState.getCoteCharacterByRank(index + 1)?.name || '綾小路 清隆';
    }
    return '綾小路 清隆';
  }
}

  applyBatchPaste(classId) {
    const textarea = document.getElementById('batch-roster-textarea');
    if (!textarea) return;

    const rawText = textarea.value.trim();
    if (!rawText) {
      window.appState.showToast('請先貼上學生名單文字', 'warning');
      return;
    }

    // Parse lines or space/comma separated names
    const rawTokens = rawText.split(/[\r\n,，、\t]+/);
    const parsedNames = [];

    rawTokens.forEach(token => {
      const trimmed = token.trim();
      if (trimmed) {
        // Remove leading seat numbers like "1.", "01 ", "1、"
        const cleanName = trimmed.replace(/^[\d\s.\-、]+/, '').trim();
        if (cleanName) {
          parsedNames.push(cleanName);
        }
      }
    });

    if (parsedNames.length === 0) {
      window.appState.showToast('無法解析出學生姓名，請檢查文字格式', 'warning');
      return;
    }

    // Build student objects with first-half Male, second-half Female default
    const totalCount = parsedNames.length;
    const halfCount = Math.ceil(totalCount / 2);
    const newStudents = parsedNames.map((name, idx) => ({
      seatNo: idx + 1,
      name: name,
      gender: (idx + 1) <= halfCount ? 'M' : 'F'
    }));

    // Create snapshot before overwriting roster
    this.store.createSnapshot(`批次匯入 ${classId} 班名單前`);

    // Update in store
    const fullData = this.store.data;
    fullData.students[classId] = newStudents;
    if (fullData.classes[classId]) {
      fullData.classes[classId].studentCount = newStudents.length;
    }
    this.store.save(fullData);

    // Sync with global appState & timetable engine so home page immediately reflects this class
    this.currentClassId = classId;
    if (window.appState) {
      window.appState.currentClassId = classId;
      if (window.timetableEngine) window.timetableEngine.setManualOverride(classId);
      window.appState.renderClassDropdown();
      window.appState.updateHeaderStatus();
    }

    window.appState.showToast(`🎉 成功為 ${classId} 班匯入 ${newStudents.length} 位學生名單！已同步至主頁點記板`, 'success');
    window.appState.closeModal();
    this.render('roster-manager-view');
    if (window.matrixView) window.matrixView.render('classroom-matrix-view', classId);
  }

  applyGenderSplit(classId) {
    const input = document.getElementById('roster-gender-split-input');
    const val = input ? parseInt(input.value, 10) : 0;

      window.appState.showToast('請輸入有效的座號界線數字', 'warning');
      return;

    this.store.setGenderSplitBoundary(classId, val);

  updateStudentName(classId, seatNo, newName) {
    const cleanName = newName.trim();
    if (!cleanName) return;

    const fullData = this.store.data;
    const student = (fullData.students[classId] || []).find(s => s.seatNo === seatNo);
    if (student) {
      student.name = cleanName;
      this.store.save(fullData);
      window.appState.showToast(`已更新 ${seatNo} 號姓名為：${cleanName}`, 'info');
      if (window.matrixView) window.matrixView.render('classroom-matrix-view', window.appState.currentClassId);
    }
  }

  addNewStudentRow(classId) {
    const fullData = this.store.data;
    if (!fullData.students[classId]) fullData.students[classId] = [];
    const list = fullData.students[classId];
    const newSeatNo = list.length > 0 ? Math.max(...list.map(s => s.seatNo)) + 1 : 1;

    list.push({
      seatNo: newSeatNo,
      name: `新學生${newSeatNo}`,
      gender: 'M'
    });
    if (fullData.classes[classId]) {
      fullData.classes[classId].studentCount = list.length;
    }
    this.store.save(fullData);
    this.render('roster-manager-view');
    if (window.matrixView) window.matrixView.render('classroom-matrix-view', window.appState.currentClassId);
  }

  deleteStudent(classId, seatNo) {
    if (confirm(`確定要刪除 ${seatNo} 號學生嗎？`)) {
      const fullData = this.store.data;
      if (fullData.students[classId]) {
        fullData.students[classId] = fullData.students[classId].filter(s => s.seatNo !== seatNo);
        if (fullData.classes[classId]) {
          fullData.classes[classId].studentCount = fullData.students[classId].length;
        }
        this.store.save(fullData);
        window.appState.showToast(`已刪除座號 ${seatNo} 號`, 'info');
        this.render('roster-manager-view');
        if (window.matrixView) window.matrixView.render('classroom-matrix-view', window.appState.currentClassId);
      }
    }
  }

  saveNewClass(e) {

    this.currentClassId = id;

      window.appState.currentClassId = id;
      if (window.timetableEngine) window.timetableEngine.setManualOverride(id);
      window.appState.renderClassDropdown();

  deleteClass(classId) {
    const classes = Object.values(this.store.getClasses());
    if (classes.length <= 1) {
      window.appState.showToast('系統至少需保留一個班級，無法刪除', 'warning');
      return;
    }

    if (confirm(`⚠️ 確定要刪除 ${classId} 班及其所有學生名單與記點記錄嗎？`)) {
      this.store.createSnapshot(`刪除 ${classId} 班前`);
      const fullData = this.store.data;
      delete fullData.classes[classId];
      delete fullData.students[classId];
      this.store.save(fullData);

      const remainClasses = Object.values(fullData.classes);
      this.currentClassId = remainClasses[0].id;
      window.appState.currentClassId = this.currentClassId;
      window.appState.showToast(`已刪除 ${classId} 班`, 'info');

  selectQuickRecordTag(tagId, tagName, category, delta) {
    this.quickRecordState = { tagId, tagName, category, delta };
    const tagInput = document.getElementById('quick-record-tag-name');
    const deltaInput = document.getElementById('quick-record-delta');
    if (tagInput) tagInput.value = tagName;
    if (deltaInput) deltaInput.value = delta;

    document.querySelectorAll('.quick-tag-chip').forEach(el => {
      el.classList.remove('ring-2', 'ring-pink-500', 'ring-amber-400', 'font-black');
    });
    const chip = document.getElementById(`quick-tag-chip-${tagId}`);
    if (chip) {
      const isOAA = window.appStore && window.appStore.getTheme() === 'oaa';
      chip.classList.add('ring-2', isOAA ? 'ring-amber-400' : 'ring-pink-500', 'font-black');
    }
  }

  setQuickRecordDelta(delta) {
    const deltaInput = document.getElementById('quick-record-delta');
    if (deltaInput) {
      deltaInput.value = delta;
      if (this.quickRecordState) this.quickRecordState.delta = delta;
    }
  }

  saveQuickRecord(classId, seatNo) {
    const student = this.store.getStudent(classId, seatNo);
    const tagInput = document.getElementById('quick-record-tag-name');
    const deltaInput = document.getElementById('quick-record-delta');
    const noteInput = document.getElementById('quick-record-note');
    const dateInput = document.getElementById('quick-record-date');

    const tagName = tagInput ? tagInput.value.trim() : '日常行為紀錄';
    const delta = deltaInput ? parseInt(deltaInput.value, 10) || 0 : 0;
    const note = noteInput ? noteInput.value.trim() : '';
    const date = dateInput ? dateInput.value : new Date().toISOString().split('T')[0];
    const category = (this.quickRecordState && this.quickRecordState.category) || 'discipline';

    this.store.addEvent({
      classId,
      seatNo,
      period: 0,
      tagId: (this.quickRecordState && this.quickRecordState.tagId) || 'homeroom_daily',
      tagName: tagName || '日常行為紀錄',
      category,
      delta,
      severity: delta > 0 ? 'positive' : delta < 0 ? 'warning' : 'neutral',
      note: note ? `[日常行為紀錄] ${note}` : `[日常行為紀錄] ${tagName}`,
      date
    });

    if (delta > 0 && window.appState?.playChime) {
      window.appState.playChime();
    } else if (delta < 0 && window.appState?.playWarning) {
      window.appState.playWarning();
    }

    window.appState.showToast(`⚡ 已為 ${seatNo} 號 ${student ? student.name : ''} 登記「${tagName} (${delta > 0 ? '+' : ''}${delta})」！`, 'success');
    window.appState.closeModal();
    this.render('roster-manager-view');
    if (window.matrixView) {
      window.matrixView.render('classroom-matrix-view', classId);
    }
  }
}

              <!-- 1. Select Tag -->
              <div>
                <label class="block text-xs font-black text-slate-800 mb-1.5 flex items-center justify-between">
                  <span>🏷️ 選擇課堂記點標籤</span>
                  <span id="retro-delta-header" class="text-[11px] font-bold ${this.customDelta > 0 ? 'text-emerald-600' : this.customDelta < 0 ? 'text-rose-600' : 'text-slate-500'}">

                  </span>
                </label>
                <div class="grid grid-cols-2 gap-2 max-h-[160px] overflow-y-auto pr-1">
                  ${tags.map(t => `
                    <button type="button" id="retro-tag-btn-${t.id}" onclick="retroLogView.selectTag('${t.id}')" 
                      class="p-2 rounded-xl text-left border text-xs font-black transition flex items-center justify-between ${
                        this.selectedTagId === t.id 
                          ? 'bg-pink-100 text-pink-900 border-pink-400 shadow-sm'

                      }">
                      <span class="truncate">${t.name}</span>
                      <span class="text-[10px] px-1.5 py-0.2 rounded-md ${t.delta > 0 ? 'bg-emerald-100 text-emerald-800' : t.delta < 0 ? 'bg-rose-100 text-rose-800' : 'bg-slate-200 text-slate-700'}">

              <div>

                  <div class="flex items-center gap-1">
                    <button type="button" onclick="retroLogView.adjustDelta(-1)" class="w-6 h-6 rounded-lg bg-rose-100 text-rose-800 font-black text-xs hover:bg-rose-200">-</button>
                    <span id="retro-delta-badge" class="font-mono font-black text-xs px-2 py-0.5 rounded-lg border ${this.customDelta > 0 ? 'color-rule-pos-badge' : this.customDelta < 0 ? 'color-rule-neg-badge' : 'color-rule-zero-badge'}">
                      ${this.customDelta > 0 ? '+' : ''}${this.customDelta}
                    </span>
                    <button type="button" onclick="retroLogView.adjustDelta(1)" class="w-6 h-6 rounded-lg bg-emerald-100 text-emerald-800 font-black text-xs hover:bg-emerald-200">+</button>

              <div>

                <textarea id="retro-memo-input" rows="3" oninput="retroLogView.customNote = this.value" placeholder="請輸入或點擊下方快速評語..." 
                  class="w-full border-2 border-pink-200 rounded-2xl p-2.5 text-xs font-bold focus:outline-none focus:border-pink-500 bg-white font-sans">${this.customNote}</textarea>

                <!-- Quick Templates -->
                <div class="flex flex-wrap gap-1 mt-1.5">
                  <button id="retro-first-tpl-btn" type="button" onclick="retroLogView.applyTemplate('今日上課主動上台解題，思維清晰')" class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100 transition">
                    + 主動解題
                  </button>
                  <button type="button" onclick="retroLogView.applyTemplate('課堂學習專注，認真筆記')" class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100 transition">
                    + 專注認真
                  </button>
                  <button type="button" onclick="retroLogView.applyTemplate('課堂稍有分心，經提醒已迅速跟上')" class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100 transition">
                    • 分心已改善
                  </button>
                  <button type="button" onclick="retroLogView.applyTemplate('未帶作業/學用品，已指導補齊')" class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-rose-50 text-rose-700 border border-rose-200 hover:bg-rose-100 transition">
                    - 缺學用品
                  </button>

              </div>

              <!-- 4. 1-Click Batch Submit Button -->
              <button id="retro-submit-btn" onclick="retroLogView.submitBatch()"

                <span class="kitty-bow !w-4 !h-4"></span>
                <span id="retro-submit-btn-text">✨ 立即 1 鍵批次補記 (${this.selectedSeats.size} 位學生)</span>
